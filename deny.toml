[graph]
# The output table provides options for how/if diagnostics are outputted
[output]
# When outputting inclusion graphs in diagnostics that include features, this
# option can be used to specify the depth at which feature edges will be added.
# This option is included since the graphs can be quite large and the addition
# of features from the crate(s) to all of the graph roots can be far too verbose.
# This option can be overridden via `--feature-depth` on the cmd line
feature-depth = 1

[advisories]
# The lint level for crates that have been yanked from their source registry
yanked = "warn"

# Transitive unmaintained crates do not fail, but direct workspace dependencies do.
unmaintained = "workspace"
# Accepted risks. Revisit when safe upstream alternatives are available.
ignore = [
    # paste is unmaintained and requires replacing direct workspace usage.
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; migration requires replacing direct workspace use" },

    # figlet-rs 1.0.0 pulls in zip 0.6.x, but Iggy only uses
    # FIGlet::standard() with the bundled font. It does not extract
    # untrusted ZIP archives. Revisit when figlet-rs supports a
    # patched zip release.
    { id = "RUSTSEC-2026-0367", reason = "zip via figlet-rs; no filesystem extraction" },
    { id = "RUSTSEC-2026-0368", reason = "zip via figlet-rs; no symlink extraction" },
    { id = "RUSTSEC-2026-0369", reason = "zip via figlet-rs; no extraction permissions applied" },
    { id = "RUSTSEC-2026-0429", reason = "zip via figlet-rs; no symlink extraction" },
    { id = "RUSTSEC-2026-0545", reason = "zip via figlet-rs; no AES-encrypted ZIP entry handling" },
    { id = "RUSTSEC-2026-0548", reason = "zip via figlet-rs; no streaming ZIP extraction" },
]

[licenses]
# Keep aligned with about.toml and ASF redistribution policy.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-3-Clause-Clear",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "NCSA",
    "bzip2-1.0.6",
]

exceptions = [
    # Allow CDLA-Permissive-2.0 only for the specified certificate crates.
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
