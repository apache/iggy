# -- Iggy server configuration
server:
  # -- Client-facing address published in cluster metadata. Declaring
  # `IGGY_NODE_ADVERTISED_ADDRESS` in `server.env` instead also works, but
  # setting both is refused at render time. Empty falls back to the in-cluster
  # Service DNS name.
  advertisedAddress: ""
  # -- Enable the Iggy server deployment
  enabled: true
  # -- Number of server replicas
  replicaCount: 1
  image:
    # -- Server image repository
    repository: apache/iggy
    # -- Image pull policy
    pullPolicy: Always
    # -- Server image tag (overrides chart appVersion)
    tag: "0.9.0-edge.6"
  ports:
    # -- HTTP API port
    http: 3000
    # -- QUIC protocol port (UDP)
    quic: 8080
    # -- TCP protocol port
    tcp: 8090
    # -- WebSocket protocol port
    websocket: 8092
    # -- Replica-to-replica consensus port. Only published when
    # `server.cluster.enabled` is true.
    tcpReplica: 9090

  service:
    # -- Service type for the server
    type: ClusterIP
    # -- Service port for the server
    port: 3000

  serviceMonitor:
    # -- Enable ServiceMonitor for Prometheus Operator
    enabled: false
    # -- Namespace to deploy the ServiceMonitor
    namespace: ""
    # -- Scrape interval (fallback to Prometheus default)
    interval: 30s
    # -- Additional labels for the ServiceMonitor
    additionalLabels: {}
    # -- Honor labels from the target
    honorLabels: false
    # -- Path to scrape metrics from
    path: /metrics
    # -- Timeout for scrape metrics request
    scrapeTimeout: 10s
    # -- Authorization for the scrape request. The metrics endpoint requires a
    # bearer credential (e.g. a personal access token stored in a Secret):
    # authorization:
    #   credentials:
    #     name: iggy-metrics-token
    #     key: token
    authorization: {}

  users:
    root:
      # -- Create a secret for the root user credentials
      createSecret: true
      # -- Root username
      username: iggy
      # -- Root password
      password: changeit
      existingSecret:
        # -- Name of existing secret for root credentials
        name: ""
        # -- Key in secret for username
        usernameKey: username
        # -- Key in secret for password
        passwordKey: password

  persistence:
    # -- Enable persistence using PVC
    enabled: false
    # -- PVC annotations
    annotations: {}
    # -- Storage class for PVC (empty uses default provisioner)
    storageClass: ""
    # -- Use existing PVC (requires persistence.enabled: true)
    existingClaim: ""
    # -- PVC access mode
    accessMode: ReadWriteOnce
    # -- PVC storage size
    size: 8Gi

  # -- Server-side encryption of message payloads and state commands, using
  # AES-256-GCM. Every node of a cluster must hold the identical key, or it
  # cannot read data another node wrote.
  encryption:
    # -- Enable encryption at rest
    enabled: false
    # -- 32-byte key, base64 encoded. Ignored when `existingSecret.name` is set.
    # Prefer `existingSecret` outside development: a value here is stored in the
    # Helm release and readable by anyone who can read it.
    key: ""
    existingSecret:
      # -- Name of an existing Secret holding the encryption key
      name: ""
      # -- Key inside that Secret
      key: encryptionKey

  # -- Secrets used to sign and validate HTTP bearer tokens. Left unset, each
  # node generates a random secret on every start, which invalidates tokens
  # across restarts and keeps them node-local. Setting the identical secret on
  # every node makes bearers valid cluster-wide and activates follower to
  # primary HTTP forwarding; `cluster.auth.enabled` derives the same thing from
  # the replica PSK, so it is an alternative rather than an addition.
  jwt:
    # -- Encoding secret. Ignored when `existingSecret.name` is set.
    encodingSecret: ""
    # -- Decoding secret. Ignored when `existingSecret.name` is set.
    decodingSecret: ""
    existingSecret:
      # -- Name of an existing Secret holding the JWT secrets
      name: ""
      # -- Key inside that Secret holding the encoding secret
      encodingSecretKey: jwtEncodingSecret
      # -- Key inside that Secret holding the decoding secret
      decodingSecretKey: jwtDecodingSecret

  cluster:
    # -- Enable cluster (VSR consensus) mode. One Helm release per node: every
    # release shares the same `nodes` roster and overrides only `selfReplicaId`.
    # See the Cluster Mode section of the chart README.
    enabled: false
    # -- Cluster name, byte-identical on every node. Hashed into the on-disk
    # cluster id on first boot, so changing it later means starting from an
    # empty data directory.
    name: iggy-cluster
    # -- Which `nodes` entry this release runs, matched against `replicaId`.
    selfReplicaId: 0
    # -- Replica-to-replica authentication on the consensus port. When enabled
    # every peer must complete an authenticated handshake or be rejected, and a
    # shared secret becomes mandatory. Enabling it on a running cluster is a
    # coordinated-restart change, not a rolling one.
    auth:
      # -- Require the authenticated replica handshake
      enabled: false
      # -- Cluster-wide pre-shared key, at least 32 bytes of CSPRNG output,
      # byte-identical on every node. Ignored when `existingSecret.name` is set.
      sharedSecret: ""
      # -- Retiring key, accepted for verification only while a rotation is in
      # flight. Leave empty outside a rotation.
      previousSharedSecret: ""
      existingSecret:
        # -- Name of an existing Secret holding the pre-shared keys
        name: ""
        # -- Key inside that Secret holding the active shared secret
        sharedSecretKey: clusterSharedSecret
        # -- Key inside that Secret holding the retiring shared secret
        previousSharedSecretKey: clusterPreviousSharedSecret

    # -- Cluster roster, mirroring the server's `[[cluster.nodes]]` config.
    # Every node runs the identical list. `ip` is the replica-plane address:
    # this node's consensus listener binds it verbatim and every peer dials it
    # verbatim, so it must be a literal IP that the pod itself owns. With
    # `server.hostNetwork` that is the node IP. `ports.tcpReplica` is required
    # on every entry; the remaining ports default to `server.ports`.
    nodes: []
    # nodes:
    #   - name: iggy-node-0
    #     ip: 10.0.1.5
    #     replicaId: 0
    #     # -- Optional client-facing address, a literal IP or a DNS hostname.
    #     advertisedAddress: ""
    #     ports:
    #       tcp: 8090
    #       quic: 8080
    #       http: 3000
    #       websocket: 8092
    #       tcpReplica: 9090

  # -- Run the server pod in the host network namespace. Required for cluster
  # mode, where the replica listener binds the roster IP verbatim.
  hostNetwork: false

  # -- Deployment update strategy. Empty lets the chart choose: `Recreate` when
  # `hostNetwork` is set, because a rolling update would wait forever for a
  # replacement pod that cannot bind host ports the outgoing pod still holds,
  # and the Kubernetes default otherwise.
  strategy: {}

  # -- Extra command-line arguments appended to the server entrypoint, e.g.
  # `["--replica-id", "0"]` when running a cluster node.
  extraArgs: []

  # -- Environment variables for the server container
  env:
    - name: RUST_LOG
      value: info
    - name: IGGY_HTTP_ADDRESS
      value: "0.0.0.0:3000"
    - name: IGGY_TCP_ADDRESS
      value: "0.0.0.0:8090"
    - name: IGGY_QUIC_ADDRESS
      value: "0.0.0.0:8080"
    - name: IGGY_WEBSOCKET_ADDRESS
      value: "0.0.0.0:8092"

  # -- Node selector for server pods
  nodeSelector: {}

  # -- Tolerations for server pods
  tolerations: []

  # -- Affinity rules for server pods
  affinity: {}

  ingress:
    # -- Enable ingress for the server
    enabled: false
    # -- Ingress class name (controller-neutral)
    className: ""
    # -- Ingress annotations (controller-specific)
    annotations: {}
    # -- Ingress hosts configuration
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    # -- Ingress TLS configuration
    tls: []

# -- Iggy web UI configuration
ui:
  # -- Enable the web UI deployment
  enabled: true
  ports:
    # -- HTTP port for web UI
    http: 3050
  server:
    # -- Iggy server endpoint (blank uses service URL)
    endpoint: ""

  service:
    # -- Service type for the UI
    type: ClusterIP
    # -- Service port for the UI
    port: 3050
  # -- Number of UI replicas
  replicaCount: 1
  # -- Extra environment variables for UI container
  env: {}
  image:
    # -- UI image repository
    repository: apache/iggy-web-ui
    # -- UI image pull policy
    pullPolicy: Always
    # -- UI image tag (overrides chart appVersion)
    tag: "edge"
  ingress:
    # -- Enable ingress for the UI
    enabled: false
    # -- Ingress class name (controller-neutral)
    className: ""
    # -- Ingress annotations (controller-specific)
    annotations: {}
    # -- Ingress hosts configuration
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    # -- Ingress TLS configuration
    tls: []
  # -- Resource limits and requests for UI
  resources: {}

  # -- Pod security context for UI pods
  podSecurityContext: {}

  # -- Container security context for UI
  securityContext: {}

  # -- Node selector for UI pods
  nodeSelector: {}

  # -- Tolerations for UI pods
  tolerations: []

  # -- Affinity rules for UI pods
  affinity: {}

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override chart name
nameOverride: ""
# -- Override full release name
fullnameOverride: ""

# -- Additional labels for all resources
additionalLabels: {}

serviceAccount:
  # -- Create a service account
  create: true
  # -- Service account annotations
  annotations: {}
  # -- Service account name (generated if not set)
  name: ""

# -- Pod annotations
podAnnotations: {}

# -- Pod security context (server uses io_uring, requires unconfined seccomp)
podSecurityContext:
  seccompProfile:
    type: Unconfined

# -- Container security context (server requires IPC_LOCK for io_uring)
securityContext:
  capabilities:
    add:
      - IPC_LOCK

# -- Resource limits and requests for server
resources: {}

autoscaling:
  # -- Enable horizontal pod autoscaling
  enabled: false
  # -- Minimum replicas for autoscaling
  minReplicas: 1
  # -- Maximum replicas for autoscaling
  maxReplicas: 100
  # -- Target CPU utilization for autoscaling
  targetCPUUtilizationPercentage: 80
  # -- Target memory utilization for autoscaling (optional)
  # targetMemoryUtilizationPercentage: 80
