{{ if .Values.server.enabled }}
  {{- if hasKey .Values.server "podSecurityContext" }}
    {{- fail "server.podSecurityContext has been moved to podSecurityContext (root level). Please update your values." }}
  {{- end }}
  {{- if gt (int .Values.server.replicaCount) 1 }}
    {{- fail "server.replicaCount > 1 is refused: the replicas share one PVC at one subPath and one advertised address, so they would run as independent servers writing the same data directory, and the server takes no lock against that. Run cluster mode instead: one release per node, each with server.cluster.enabled and its own server.cluster.selfReplicaId. See the Cluster Mode section of the chart README." }}
  {{- end }}
  {{- if .Values.server.cluster.enabled }}
    {{- include "iggy.validateCluster" . }}
  {{- end }}
  {{- include "iggy.validateSecrets" . }}
  {{- $ports := include "iggy.serverPorts" . | fromJson }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iggy.fullname" . }}
  labels:
    {{- include "iggy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  {{- if .Values.server.strategy }}
  strategy:
    {{- toYaml .Values.server.strategy | nindent 4 }}
  {{- else if .Values.server.hostNetwork }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "iggy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
  {{- $secretsChecksum := "" }}
  {{- if (include "iggy.createsSecret" .) }}
    {{- $secretsChecksum = (include (print $.Template.BasePath "/server-secrets.yaml") . | sha256sum) }}
  {{- end }}
  {{- if or $secretsChecksum .Values.podAnnotations }}
      annotations:
    {{- if $secretsChecksum }}
        checksum/server-secrets: {{ $secretsChecksum }}
    {{- end }}
    {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- end }}
      labels:
        {{- include "iggy.labels" . | nindent 8 }}
    spec:
  {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
  {{- end }}
      serviceAccountName: {{ include "iggy.serviceAccountName" . }}
      enableServiceLinks: false
  {{- if .Values.server.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
  {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
  {{- if or .Values.server.cluster.enabled .Values.server.extraArgs }}
          args:
    {{- if .Values.server.cluster.enabled }}
            - "--replica-id"
            - {{ .Values.server.cluster.selfReplicaId | quote }}
    {{- end }}
    {{- range .Values.server.extraArgs }}
            - {{ . | quote }}
    {{- end }}
  {{- end }}
          ports:
            - name: http
              containerPort: {{ int $ports.http }}
              protocol: TCP
            - name: tcp
              containerPort: {{ int $ports.tcp }}
              protocol: TCP
            - name: websocket
              containerPort: {{ int $ports.websocket }}
              protocol: TCP
            - name: quic
              containerPort: {{ int $ports.quic }}
              protocol: UDP
  {{- if .Values.server.cluster.enabled }}
            - name: tcp-replica
              containerPort: {{ int $ports.tcpReplica }}
              protocol: TCP
  {{- end }}
          env:
  {{- if .Values.server.users.root.existingSecret.name }}
            - name: IGGY_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.users.root.existingSecret.name }}
                  key: {{ .Values.server.users.root.existingSecret.usernameKey }}
            - name: IGGY_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.users.root.existingSecret.name }}
                  key: {{ .Values.server.users.root.existingSecret.passwordKey }}
  {{- else }}{{- if .Values.server.users.root.createSecret }}
            - name: IGGY_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "iggy.fullname" . }}-root-credentials
                  key: username
            - name: IGGY_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "iggy.fullname" . }}-root-credentials
                  key: password
  {{- end }}{{- end}}
  {{- $declaredInEnv := false }}
  {{- range .Values.server.env }}
    {{- if eq .name "IGGY_NODE_ADVERTISED_ADDRESS" }}
      {{- if not .value }}
        {{- fail "IGGY_NODE_ADVERTISED_ADDRESS is declared in server.env with an empty value. The server reads that as unset and refuses to start behind a wildcard bind. Give the entry the address clients dial, or drop it and set server.advertisedAddress." }}
      {{- end }}
      {{- $declaredInEnv = true }}
    {{- end }}
  {{- end }}
  {{- if and .Values.server.cluster.enabled .Values.server.advertisedAddress }}
    {{- fail "server.advertisedAddress is set together with server.cluster.enabled. In cluster mode the server ignores IGGY_NODE_ADVERTISED_ADDRESS and publishes the roster entry's ip, or its advertisedAddress when one is given, so set it on this node's server.cluster.nodes entry instead." }}
  {{- end }}
  {{- if and $declaredInEnv .Values.server.advertisedAddress }}
    {{- fail "IGGY_NODE_ADVERTISED_ADDRESS is set in server.env and server.advertisedAddress is also set. The server.env entry wins and server.advertisedAddress is ignored. Please set only one." }}
  {{- end }}
  {{- if and (not $declaredInEnv) (not .Values.server.cluster.enabled) }}
            - name: IGGY_NODE_ADVERTISED_ADDRESS
              value: {{ .Values.server.advertisedAddress | default (printf "%s.%s.svc.cluster.local" (include "iggy.fullname" .) .Release.Namespace) | quote }}
  {{- end }}
  {{- if .Values.server.cluster.enabled }}
            {{- include "iggy.clusterEnv" . | nindent 12 }}
  {{- end }}
  {{- with (include "iggy.secretEnv" . | trim) }}
            {{- . | nindent 12 }}
  {{- end }}
  {{- if .Values.server.env }}
    {{- range .Values.server.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
    {{- end }}
  {{- end }}
          volumeMounts:
            - name: iggy-server-data
              mountPath: /app/local_data
              subPath: {{ ternary "root" (printf "%s/root" .Values.server.persistence.subPath) (empty .Values.server.persistence.subPath) }}

          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
  {{- end }}
      volumes:
        - name: iggy-server-data
  {{- if .Values.server.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ if .Values.server.persistence.existingClaim }}{{ .Values.server.persistence.existingClaim }}{{- else }}{{ template "iggy.fullname" . }}{{- end }}
  {{- else }}
          emptyDir: {}
  {{- end }}
{{- end }}
{{ if .Values.ui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iggy.fullname" . }}-ui
  labels:
    {{- include "iggy-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "iggy-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
  {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
  {{- end }}
      labels:
        {{- include "iggy-ui.labels" . | nindent 8 }}
    spec:
  {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
  {{- end }}
      serviceAccountName: {{ include "iggy.serviceAccountName" . }}
  {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
  {{- end }}
      containers:
        - name: {{ .Chart.Name }}
  {{- with .Values.ui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
  {{- end }}
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.ports.http }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          env:
            - name: PUBLIC_IGGY_API_URL
  {{- if .Values.ui.server.endpoint }}
              value: {{ .Values.ui.server.endpoint }}
  {{- else }}
              value: http://{{ include "iggy.fullname" . }}:{{ .Values.server.ports.http }}{{- end }}
    {{- with .Values.ui.env }}
          {{ . | toYaml | nindent 10 }}
    {{- end }}
    {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- end }}
