{{- if and .Values.server.enabled (include "iggy.createsSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iggy.secretName" . }}
  labels:
    {{- include "iggy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.server.encryption.enabled (not .Values.server.encryption.existingSecret.name) }}
  encryptionKey: {{ .Values.server.encryption.key | quote }}
  {{- end }}
  {{- if not .Values.server.jwt.existingSecret.name }}
    {{- with .Values.server.jwt.encodingSecret }}
  jwtEncodingSecret: {{ . | quote }}
    {{- end }}
    {{- with .Values.server.jwt.decodingSecret }}
  jwtDecodingSecret: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- if and .Values.server.cluster.auth.enabled (not .Values.server.cluster.auth.existingSecret.name) }}
  clusterSharedSecret: {{ .Values.server.cluster.auth.sharedSecret | quote }}
    {{- with .Values.server.cluster.auth.previousSharedSecret }}
  clusterPreviousSharedSecret: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
