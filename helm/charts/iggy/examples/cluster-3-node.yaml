# Shared roster for a three-node Iggy cluster. Install one release per node,
# overriding only the identity:
#
#   for i in 0 1 2; do
#     helm upgrade --install "iggy-n$i" ./helm/charts/iggy \
#       -f ./helm/charts/iggy/examples/cluster-3-node.yaml \
#       --set "server.cluster.selfReplicaId=$i" \
#       --set "server.nodeSelector.kubernetes\.io/hostname=node-$i"
#   done
#
# Replace the `ip` values with the IPs of the nodes you pin each release to.
# The server binds this address verbatim for replica traffic, so with
# hostNetwork it must be the node's own IP.

ui:
  enabled: false

server:
  hostNetwork: true

  cluster:
    enabled: true
    name: iggy-cluster
    nodes:
      - name: iggy-node-0
        ip: 10.0.1.10
        replicaId: 0
        ports:
          tcpReplica: 9090
      - name: iggy-node-1
        ip: 10.0.1.11
        replicaId: 1
        ports:
          tcpReplica: 9090
      - name: iggy-node-2
        ip: 10.0.1.12
        replicaId: 2
        ports:
          tcpReplica: 9090

  env:
    - name: RUST_LOG
      value: info
    # Bind interface only: in cluster mode every listener port comes from the
    # roster entry for this node.
    - name: IGGY_HTTP_ADDRESS
      value: "0.0.0.0:3000"
    - name: IGGY_TCP_ADDRESS
      value: "0.0.0.0:8090"
    - name: IGGY_QUIC_ADDRESS
      value: "0.0.0.0:8080"
    - name: IGGY_WEBSOCKET_ADDRESS
      value: "0.0.0.0:8092"
