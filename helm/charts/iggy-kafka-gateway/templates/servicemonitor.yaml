{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "iggy-kafka-gateway.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.serviceMonitor.namespace }}
  labels:
    {{- include "iggy-kafka-gateway.labels" . | nindent 4 }}
  {{- with .Values.serviceMonitor.additionalLabels }}
      {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Only the headless Service has the http port, so each gateway is scraped once, also while it is
  # not ready.
  endpoints:
    - port: http
      path: /metrics
  {{- with .Values.serviceMonitor.interval }}
      interval: {{ . }}
  {{- end }}
  {{- with .Values.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
  {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "iggy-kafka-gateway.selectorLabels" . | nindent 6 }}
{{- end }}
