# The bootstrap Service. Kafka clients connect here first, to a gateway that is ready, and then
# to each gateway by the name it advertises under the headless Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iggy-kafka-gateway.fullname" . }}
  labels:
    {{- include "iggy-kafka-gateway.labels" . | nindent 4 }}
{{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: kafka
      port: {{ .Values.kafka.port }}
      targetPort: kafka
      protocol: TCP
  selector:
    {{- include "iggy-kafka-gateway.selectorLabels" . | nindent 4 }}
---
# One DNS name per gateway, which the gateway advertises to Kafka clients. The names resolve also
# while a gateway is not ready, so a client that holds metadata reaches it and gets a Kafka error
# code, as with a broker that lost its storage, instead of a name that does not resolve.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iggy-kafka-gateway.headlessName" . }}
  labels:
    {{- include "iggy-kafka-gateway.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: kafka
      port: {{ .Values.kafka.port }}
      targetPort: kafka
      protocol: TCP
    - name: http
      port: {{ .Values.http.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "iggy-kafka-gateway.selectorLabels" . | nindent 4 }}
