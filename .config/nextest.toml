# Floor for the flags CI and scripts/ci/storage-compat.sh pass: --no-tests
# (0.9.75), --run-ignored only (0.9.76) and --ignore-default-filter (0.9.77).
# nextest refuses to run below it, and setup-rust-with-cache replaces a
# cache-restored binary that fails `cargo nextest show-config version`.
nextest-version = { required = "0.9.77" }

[[profile.default.overrides]]
# This is a solution (or actually a workaround) for the problem that nextest does not support
# #[serial] macro which shall enforce sequential execution of the test case.
filter = 'package(integration) and test(cli::system::test_cli_session_scenario::should_be_successful)'
threads-required = "num-cpus"

# Doris tests are serialized among themselves, but no longer monopolize the
# whole runner. The all-in-one image's BE advertises 127.0.0.1:8040 for the
# FE→BE 307 redirect, so only one Doris container per process can bind
# host:8040. Within a nextest binary the fixture caches one shared container in
# `SHARED_DORIS` so the first doris test pays the ~40s boot and the rest reuse
# it; `max-threads = 1` keeps a second nextest binary (or a re-run) from
# racing the same host port, while still letting unrelated light tests fill
# the rest of the runner.
[test-groups.doris]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(integration) and test(/connectors::doris::/)'
test-group = "doris"

# Elasticsearch tests share one reusable container (fixed name
# `iggy-test-elasticsearch`, ReuseDirective::Always). Serializing the group
# lets the first test create it and the rest attach by name, instead of racing
# to create the same name concurrently (Docker 409 Conflict). Per-test
# isolation comes from a unique index per fixture, not a fresh container.
[test-groups.elasticsearch]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(integration) and test(/connectors::elasticsearch::/)'
test-group = "elasticsearch"

# Each test in this binary spawns its own real iggy-server subprocess (isolated data dir, port
# from PortGuard's own flock, so no two ever share a port). #[serial] on them is a dead letter
# under nextest - nextest runs every test as its own process, and #[serial]'s mutex only excludes
# within one process (nextest does not support #[serial] macro, same gap the workaround above
# documents). Without this override, nextest's default scheduler runs several of these processes
# at once, and every one of them inherits this workspace's cpu_allocation = "numa:auto" /
# pin_cores = true (config.toml) - concurrent pinned-core servers starve each other's shards
# instead of running each on its own core budget, the same reason core/integration's own harness
# (harness/handle/server.rs) overrides both settings for spawned test servers. This crate's harness
# does not override them, so serializing is the fix here instead.
[test-groups.kafka_bridge]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary_id(iggy-gateway-kafka::bridge_iggy_integration_tests)'
test-group = "kafka_bridge"

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
retries = 3
