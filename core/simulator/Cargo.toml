[package]
name = "simulator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
bytemuck = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
clock = { workspace = true }
configs = { workspace = true }
consensus = { workspace = true }
enumset = { workspace = true }
futures = { workspace = true }
iggy_binary_protocol = { workspace = true }
iggy_common = { workspace = true }
indexmap = { workspace = true }
journal = { workspace = true }
message_bus = { workspace = true }
metadata = { workspace = true, features = ["simulator"] }
partitions = { workspace = true, features = ["simulator"] }
rand = { workspace = true }
rand_xoshiro = { workspace = true }
secrecy = { workspace = true }
# The workspace entry disables default features: the sim only needs the
# dispatch/bootstrap library, not the mimalloc allocator or the web embed.
server = { workspace = true }
server_common = { workspace = true, features = ["simulator"] }
shard = { workspace = true, features = ["simulator"] }
strum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Test-only feature on a crate this package already depends on: the fault
# hooks the partition-driver tests arm must not compile into anything that
# ships. See `partitions/Cargo.toml`.
partitions = { workspace = true, features = ["fault-injection"] }
tempfile = { workspace = true }

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = "warn"
# Sync impls of async traits are deliberate (non-blocking bus, in-memory storage, test doubles).
unused_async_trait_impl = "allow"

[lints.rust]
warnings = "deny"
