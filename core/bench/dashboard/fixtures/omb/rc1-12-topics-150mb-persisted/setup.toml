timestamp = "2026-11-06T13:27:02Z"
suite = "cluster-3-nodes"

[environment]
label = "AWS i4i.4xlarge, 3 nodes"
server_instance = "i4i.4xlarge"
server_nodes = 3
client_instance = "i4i.4xlarge"
client_hosts = 2

[server]
version = "0.10.0-rc.1"

[properties.kernel]
"vm.dirty_background_bytes" = 268435456
"vm.dirty_bytes" = 2147483648
"vm.dirty_expire_centisecs" = 500

[properties.server]
data_file_system = "ext4"
huge_pages = 2048
placement_strategy = "cluster"
server_environment = "IGGY_SHARDING_CPU_ALLOCATION=all"
