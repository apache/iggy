# A run is official if its `suite` label is in [[suites]].
[[suites]]
name = "i4i-single"
title = "AWS i4i.4xlarge, 1 node"

[[suites]]
name = "i4i-cluster3"
title = "AWS i4i.4xlarge, 3 nodes"

[[suites]]
name = "i3en-cluster3"
title = "AWS i3en.xlarge, 3 nodes"

# The Overview shows these workloads. `workload` is the `--workload` label of the runs, and
# `metric` is one of throughput, p50, p90, p95, p99 and p999.
[[headlines]]
suite = "i4i-single"
workload = "producer-20p"
title = "Write throughput"
metric = "throughput"

[[headlines]]
suite = "i4i-single"
workload = "producer-20p-persisted@800MB"
title = "Durable write latency"
metric = "p99"

[[headlines]]
suite = "i4i-single"
workload = "end-to-end-20@1600MB"
title = "End-to-end latency"
metric = "p99"

[[headlines]]
suite = "i4i-cluster3"
workload = "producer-20p@800MB"
title = "Write latency, 3 nodes"
metric = "p99"

# Percent. A delta gets a color only if the larger value is more than this above the smaller one,
# and the two versions' ranges don't overlap. Each value sits above the largest spread seen in
# same-build reruns: 0.9.0 in the official suites, 2026-09-18 to 2026-11-04, moved throughput by up
# to 1.4%, P50 by up to 1.9x, P90, P95 and P99 by up to 1.6x, and P99.9 by up to 5.4x.
[thresholds]
throughput_pct = 3.0
p50_pct = 100.0
p90_pct = 70.0
p95_pct = 70.0
p99_pct = 70.0
p999_pct = 450.0
# A rate-limited run with a larger spread of actor run times gets the badge "uneven load".
max_time_spread_pct = 10.0
