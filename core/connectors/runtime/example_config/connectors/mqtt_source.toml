type = "source"
key = "mqtt"
enabled = true
version = 1
name = "MQTT source"
path = "target/release/libiggy_connector_mqtt_source"
plugin_config_format = "json"
verbose = false
benchmark = false

[[streams]]
stream = "iot"
topic = "telemetry"
schema = "raw"
batch_length = 100
linger_time = "5ms"

[plugin_config]
broker_url = "mqtt://127.0.0.1:1883"
subscriptions = ["devices/+/telemetry"]
protocol = "mqtt5"
qos = 1
client_id = "iggy-mqtt-source"
clean_start = false
session_expiry_interval = 3600
keep_alive = "30s"
poll_timeout = "1s"
request_capacity = 32
batch_size = 100
batch_timeout = "10ms"
verbose_logging = false

# Optional TLS configuration for mqtts:// brokers. The client certificate and
# key must be configured together. The server name must match the broker URL
# host with the current rumqttc transport API.
# [plugin_config.tls]
# ca_file = "/etc/iggy/certs/emqx-ca.pem"
# client_cert_file = "/etc/iggy/certs/client-cert.pem"
# client_key_file = "/etc/iggy/certs/client-key.pem"
# server_name = "emqx.example.com"

# Optional per-filter QoS overrides. Every key must also appear in
# subscriptions, and each value must be 0, 1, or 2.
# [plugin_config.subscription_qos]
# "devices/+/telemetry" = 2

# Optional authenticated connection:
# username = "emqx-user"
# password = "replace-me"
