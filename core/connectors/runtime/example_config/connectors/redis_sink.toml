type = "sink"
key = "redis"
enabled = true
version = 0
name = "Redis sink"
path = "target/release/libiggy_connector_redis_sink"
verbose = true

[[streams]]
stream = "user_events"
topics = ["users", "orders"]
schema = "json"
batch_length = 100
poll_interval = "5ms"
consumer_group = "redis_sink"

[plugin_config]
connection_url = "redis://localhost:6379"
mode = "stream"
stream_key = "iggy:events"
batch_size = 100
payload_format = "json"
include_metadata = true
deterministic_ids = true
# max_len = 100000
verbose_logging = false
max_retries = 3
retry_delay = "1s"
response_timeout = "5s"
