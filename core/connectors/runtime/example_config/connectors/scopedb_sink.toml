type = "sink"
key = "scopedb"
enabled = true
version = 0
name = "ScopeDB sink"
path = "target/release/libiggy_connector_scopedb_sink"
verbose = false

[[streams]]
stream = "orders"
topics = ["events"]
schema = "json"
batch_length = 1000
consumer_group = "scopedb_sink_connector"

[plugin_config]
endpoint = "https://<workspace-endpoint>"
# Prefer IGGY_CONNECTORS_SINK_SCOPEDB_PLUGIN_CONFIG_API_KEY for credentials.
# api_key = "<api-key>"
database = "scopedb"
schema = "public"
table = "events"
mode = "mapped"
payload_column = "payload"
include_metadata = true
include_headers = false
batch_size = 100
max_request_bytes = 8388608
max_concurrent_requests = 1
max_retries = 3
retry_delay = "1s"
max_retry_delay = "30s"
retry_ambiguous = false
timeout = "30s"
verbose_logging = false
