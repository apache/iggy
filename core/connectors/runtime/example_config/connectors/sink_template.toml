type = "sink"
key = "template"
enabled = true
version = 0
name = "Template sink"
path = "target/release/libiggy_connector_template_sink"
plugin_config_format = "toml"
verbose = false

[[streams]]
stream = "example_stream"
topics = ["example_topic"]
schema = "json"
batch_length = 100
poll_interval = "5ms"
consumer_group = "template_sink_connector"

[plugin_config]
connection_string = "https://api.example.com"
target = "events"
health_check_path = "/health"
batch_size = 100
timeout = "30s"
max_retries = 3
retry_delay = "500ms"
retry_max_delay = "5s"
max_open_retries = 10
open_retry_max_delay = "60s"
circuit_breaker_threshold = 5
circuit_breaker_cool_down = "30s"
