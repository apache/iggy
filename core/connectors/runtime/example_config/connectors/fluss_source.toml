type = "source"
key = "fluss"
enabled = true
version = 0
name = "Apache Fluss source"
path = "<BASE_DIR>/target/release/libiggy_connector_fluss_source"
plugin_config_format = "toml"
verbose = false

[[streams]]
stream = "events"
topic = "fluss_events"
schema = "json"
batch_length = 100
linger_time = "5ms"

[plugin_config]
bootstrap_servers = "localhost:9123"
database = "mydb"
table = "events"
table_type = "log"
starting_offset = "earliest"
poll_interval = "1s"
poll_timeout = "5s"
batch_size = 500
payload_format = "json"
include_metadata = false
verbose_logging = false
