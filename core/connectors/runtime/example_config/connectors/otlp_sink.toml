type = "sink"
key = "otlp"
enabled = true
version = 0
name = "OTLP sink"
path = "target/release/libiggy_connector_otlp_sink"
verbose = false

[[streams]]
stream = "telemetry"
topics = ["logs"]
schema = "raw"
batch_length = 500
consumer_group = "otlp_sink_connector"

[plugin_config]
endpoint = "http://localhost:4318"
compression = "gzip"
# Total attempts including the first. 1 disables retries.
max_retries = 8
retry_delay = "1s"
max_retry_delay = "10s"

# [plugin_config.headers]
# authorization = "Bearer <YOUR_TOKEN_HERE>"
