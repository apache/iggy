[http] # Optional HTTP API configuration
enabled = true
address = "127.0.0.1:8081"
api_key = "" # Optional API key for authentication to be passed as `api-key` header

[http.cors] # Optional CORS configuration for HTTP API
enabled = false
allowed_methods = ["GET", "POST", "PUT", "DELETE"]
allowed_origins = ["*"]
allowed_headers = ["content-type"]
exposed_headers = [""]
allow_credentials = false
allow_private_network = false

[http.metrics] # Optional Prometheus metrics configuration
enabled = false
endpoint = "/metrics"

[http.tls] # Optional TLS configuration for HTTP API
enabled = false
cert_file = "core/certs/iggy_cert.pem"
key_file = "core/certs/iggy_key.pem"

[iggy]
address = "localhost:8090"
username = "iggy"
password = "iggy"
token = "" # Personal Access Token (PAT) can be used instead of username and password

[iggy.tls] # Optional TLS configuration for Iggy TCP connection
enabled = false
ca_file = "core/certs/iggy_ca_cert.pem"
domain = "" # Optional domain for TLS connection

[state]
path = "local_state" # Used by storage = "file"
storage = "file" # "file" | "http"

# HTTP state storage backend, used when storage = "http". Source state is
# stored at {url}/source_{key} with optimistic concurrency (ETag/If-Match)
# and idempotent retries (Idempotency-Key).
[state.http]
url = "" # Base URL of the state server, no trailing slash. Required for storage = "http".
load_method = "get" # "get" | "post"
save_method = "put" # "put" | "post" | "patch"
timeout = "5s"

# Static headers attached verbatim to every request (e.g. authentication).
# [state.http.request_headers]
# authorization = "Bearer ..."

[state.http.retry]
enabled = true
max_attempts = 4
initial_backoff = "200ms"
max_backoff = "2s"
backoff_multiplier = 2

[connectors]
config_type = "local"
config_dir = ""

[telemetry]
enabled = false
service_name = "iggy-connectors"

[telemetry.logs]
transport = "grpc"
endpoint = "http://localhost:4317"

[telemetry.traces]
transport = "grpc"
endpoint = "http://localhost:4317"
