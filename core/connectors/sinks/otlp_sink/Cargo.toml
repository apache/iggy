[package]
name = "iggy_connector_otlp_sink"
version = "0.1.0"
description = "Iggy OTLP sink connector for exporting logs from Iggy streams to any OpenTelemetry-compatible backend over OTLP/HTTP."
edition = "2024"
license = "Apache-2.0"
keywords = ["iggy", "messaging", "streaming", "opentelemetry", "otlp"]
categories = ["command-line-utilities", "network-programming"]
homepage = "https://iggy.apache.org"
documentation = "https://iggy.apache.org/docs"
repository = "https://github.com/apache/iggy"
readme = "../../README.md"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
humantime = { workspace = true }
iggy_connector_sdk = { workspace = true }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "logs"] }
prost = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
