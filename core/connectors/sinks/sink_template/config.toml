type = "sink"
key = "template"
enabled = true
version = 0
name = "Template sink"
path = "../../target/release/libiggy_connector_template_sink"
plugin_config_format = "toml"
verbose = false

[[streams]]
stream = "example_stream"
topics = ["example_topic"]
schema = "json"
batch_length = 100
# Long poll: the server answers once `min_count` messages are ready or `max_wait`
# expires. These replace `poll_interval`, which the runtime refuses for sinks.
# Waiting for a full batch means fewer, larger writes to the destination, and an
# idle topic costs one request per `max_wait`. `min_count` must not exceed
# `batch_length`; `max_wait` must be above zero, and the server caps it at 30s.
max_wait = "2s"
min_count = 100
consumer_group = "template_sink_connector"

[plugin_config]
connection_string = "https://api.example.com"
target = "events"
health_check_path = "/health"
batch_size = 100
timeout = "30s"
max_retries = 3
retry_delay = "500ms"
retry_max_delay = "5s"
max_open_retries = 10
open_retry_max_delay = "60s"
circuit_breaker_threshold = 3
# Must be shorter than `max_delivery_time`; `open()` rejects the config otherwise.
circuit_breaker_cool_down = "10s"
# How long one `consume()` call keeps trying before it gives up on its messages. Keep it
# well under a minute: the call blocks a runtime worker thread, and a stop waits for it.
max_delivery_time = "20s"
verbose_logging = false
# auth_token = "replace-me"   # uncomment if your destination needs bearer/API-key auth
