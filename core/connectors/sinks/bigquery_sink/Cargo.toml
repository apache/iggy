[package]
name = "iggy_connector_bigquery_sink"
version = "0.1.0"
description = "Iggy BigQuery sink connector for streaming messages into Google BigQuery via the Storage Write API"
edition = "2024"
license = "Apache-2.0"
keywords = ["iggy", "messaging", "streaming", "bigquery", "sink"]
categories = ["command-line-utilities", "database", "network-programming"]
homepage = "https://iggy.apache.org"
documentation = "https://iggy.apache.org/docs"
repository = "https://github.com/apache/iggy"
readme = "../../README.md"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
gcloud-bigquery = { workspace = true }
gcloud-gax = { workspace = true }
gcloud-googleapis = { workspace = true }
hex = { workspace = true }
humantime = { workspace = true }
iggy_connector_sdk = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true }
token-source = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
iggy_common = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[lints]
workspace = true
