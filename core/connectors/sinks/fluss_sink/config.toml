type = "sink"
key = "fluss"
enabled = true
version = 0
name = "Fluss sink"
path = "../../target/release/libiggy_connector_fluss_sink"
verbose = false

[[streams]]
stream = "user_events"
topics = ["users", "orders"]
schema = "json"
batch_length = 100
poll_interval = "5ms"
consumer_group = "fluss_sink"

[plugin_config]
# iggy's fluss table settings
verbose_logging = false
target_database = "fluss"
target_table = "iggy_messages"
auto_create_table = true
include_metadata = true
include_checksum = true
include_origin_timestamp = true
# payload_format = "bytea"
payload_format = "json"

# fluss connection settings, passed to the fluss connector
bootstrap_servers = "127.0.0.1:9123"
writer_request_max_size = 10485760
writer_acks = "all"
writer_retries = 3
writer_batch_size = 2097152
writer_bucket_no_key_assigner = "sticky"
writer_batch_timeout_ms = 100
writer_enable_idempotence = true
writer_max_inflight_requests_per_bucket = 5
writer_buffer_memory_size = 67108864
writer_buffer_wait_timeout_ms = "18446744073709551615"
connect_timeout_ms = 120000
security_protocol = "PLAINTEXT"
security_sasl_mechanism = "PLAIN"
security_sasl_username = ""
security_sasl_password = ""

# optional table creation settings, keyed by database and table name
[plugin_config.tables."fluss.table_with_configs"]
# if primary keys is empty, the table is created as a log table
primary_keys = ["id", "iggy_stream"]
partitioned_by = ["iggy_stream"]
bucket_keys = ["id"]
bucket_count = 1

# optional table creation settings, keyed by database and table name
[plugin_config.tables."fluss.iggy_messages"]
# if primary keys is empty, the table is created as a log table
primary_keys = []
bucket_keys = []
bucket_count = 1

[plugin_config.tables."fluss.iggy_messages".properties]
"table.datalake.enabled" = "false"

[plugin_config.tables."fluss.partitioned_iggy_messages"]
primary_keys = []
partitioned_by = ["event_day"]
bucket_keys = []
bucket_count = 1

[plugin_config.tables."fluss.partitioned_iggy_messages".properties]
"table.datalake.enabled" = "false"
"table.auto-partition.enabled" = "true"
"table.auto-partition.time-unit" = "DAY"
"table.auto-partition.time-format" = "yyyy-MM-dd"
"table.auto-partition.time-zone" = "UTC"
