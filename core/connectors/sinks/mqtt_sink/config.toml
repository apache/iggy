type = "sink"
key = "mqtt"
enabled = true
version = 0
name = "MQTT sink"
path = "../../target/release/libiggy_connector_mqtt_sink"
plugin_config_format = "json"

[[streams]]
stream = "telemetry"
topics = ["events"]
schema = "raw"
batch_length = 100
poll_interval = "5ms"
consumer_group = "mqtt_sink_connector"

[plugin_config]
broker_url = "mqtt://127.0.0.1:1883"
protocol = "mqtt5"
client_id = "iggy-mqtt-sink"
topic = "iggy.messages"
topic_mode = "static"
topic_template = "{stream}/{topic}"
fallback_topic = "{stream}/{topic}"
qos = 1
retain = false
keep_alive = "30s"
request_capacity = 32
publish_timeout = "30s"
shutdown_timeout = "30s"
max_retries = 3
retry_delay = "1s"
max_retry_delay = "30s"
max_in_flight = 1
verbose_logging = false
