type = "sink"
key = "opendal"
enabled = true
version = 0
name = "OpenDAL sink"
path = "../../target/release/libiggy_connector_opendal_sink"
plugin_config_format = "toml"
verbose = false
benchmark = false

[[streams]]
stream = "example_stream"
topics = ["example_topic"]
schema = "json"
batch_length = 100
poll_interval = "100ms"
consumer_group = "opendal_sink"

[plugin_config]
service = "fs"
path_prefix = "iggy/messages"
path_template = "{stream}/{topic}/{date}/{hour}"
max_attempts = 3
retry_delay = "1s"
verbose_logging = false

[plugin_config.options]
root = "/tmp/iggy-opendal"
