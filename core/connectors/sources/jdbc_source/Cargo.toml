[package]
name = "iggy_connector_jdbc_source"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
keywords = ["iggy", "messaging", "streaming", "jdbc", "source"]
categories = ["database"]
description = "JDBC source connector for Iggy with PostgreSQL integration coverage"
readme = "README.md"
publish = false

[package.metadata.cargo-machete]
ignored = ["dashmap"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }

# Required by source_connector! macro
dashmap = { workspace = true }

# For parsing duration strings (poll_interval)
humantime = { workspace = true }

# Connector SDK
iggy_connector_sdk = { workspace = true }

# JNI for Java interop with invocation support
jni = { workspace = true }

# For sanitizing passwords in logs
regex = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
rmp-serde = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
