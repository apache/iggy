# TEMPLATE — rename the package (and this directory) to
# `iggy_connector_<yourname>_source` before publishing, and update the
# `[[sources]]` entry you add to the workspace root Cargo.toml accordingly.

[package]
name = "iggy_connector_template_source"
version = "0.1.0"
description = "Template for an Apache Iggy source connector — copy this crate and fill in the TODO sections."
edition = "2024"
license = "Apache-2.0"
keywords = ["iggy", "messaging", "streaming"]
categories = ["command-line-utilities", "database", "network-programming"]
homepage = "https://iggy.apache.org"
documentation = "https://iggy.apache.org/docs"
repository = "https://github.com/apache/iggy"
publish = false

[package.metadata.cargo-machete]
# dashmap is used only inside the `source_connector!` macro expansion, so a
# naive unused-dependency scan won't see the usage — keep it ignored rather
# than removing it, or the plugin will fail to compile.
ignored = ["dashmap"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
async-trait = { workspace = true }
dashmap = { workspace = true }
humantime = { workspace = true }
iggy_common = { workspace = true }
iggy_connector_sdk = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
rmp-serde = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
