type = "source"
key = "rabbitmq"
enabled = true
version = 1
name = "RabbitMQ source"
path = "target/release/libiggy_connector_rabbitmq_source"
plugin_config_format = "json"
# Do not enable exactly_once. The source cannot reliably replay batches after a restart.
exactly_once = false

[[streams]]
stream = "events"
topic = "rabbitmq"
schema = "raw"
batch_length = 100
linger_time = "5ms"

[plugin_config]
amqp_url = "amqp://guest:guest@127.0.0.1:5672/%2f"
queue = "events"
batch_size = 100
batch_timeout = "10ms"
include_metadata = false
timeout_secs = 30
verbose_logging = false
