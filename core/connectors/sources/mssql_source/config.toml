type = "source"
key = "mssql"
enabled = true
version = 1
name = "MSSQL source"
path = "target/release/libiggy_connector_mssql_source"
plugin_config_format = "json"
verbose = false
benchmark = false

# Commit order needs a one-partition, durability=persisted topic. The runtime creates one if missing.
[[streams]]
stream = "cdc"
topic = "mssql"
schema = "json"
batch_length = 1000
linger_time = "5ms"

[plugin_config]
# ADO.NET string with Database=. A named instance needs its port. Set the password through an environment override.
connection_string = "Server=tcp:localhost,1433;Database=shop;User Id=iggy_cdc;Password=replace-me;Encrypt=true;TrustServerCertificate=false"
# Unquoted schema.table names. Each table must already be enabled for CDC.
tables = ["dbo.users"]
poll_interval = "1s"
batch_size = 1000
query_timeout = "30s"
# "earliest" reads every retained change on the first start. "latest" skips them.
start_position = "earliest"
verbose_logging = false
