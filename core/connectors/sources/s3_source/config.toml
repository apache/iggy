type = "source"
key = "s3"
enabled = true
version = 0
name = "S3 source"
path = "../../target/release/libiggy_connector_s3_source"
plugin_config_format = "json"

[[streams]]
stream = "test_stream"
topic = "test_topic"
schema = "raw"
batch_length = 1000
linger_time = "5ms"

[plugin_config]
bucket = "events"
region = "us-east-1"
poll_interval = "5s"
max_record_bytes = 1048576
max_batch_bytes = 4194304
max_batch_messages = 1000
verbose_logging = false
