type = "source"
key = "http_github"
enabled = true
version = 0
name = "HTTP source (GitHub)"
path = "../../target/release/libiggy_connector_http_source"
verbose = false

[[streams]]
stream = "webhooks"
topic = "github_events"
schema = "raw"
batch_length = 100
linger_time = "5ms"

[plugin_config]
# Public listener. Instances that name the same address share one listener.
# Naming a different address binds a second listener instead, which then fails
# on the shared admin port - so keep this identical across instances that are
# meant to share.
listen_addr = "0.0.0.0:9090"
# Management API, admin health, and metrics. Never route this through the
# public load balancer.
admin_listen_addr = "127.0.0.1:9091"
instance_name = "http_github"
# Exposes POST /topics/github_events. Omit for secret-path endpoints only.
topic_path = "github_events"
# Guards the named path. Omit when an authenticating gateway fronts it.
auth_bearer_token = "global-webhook-secret"
# Enables POST/GET/PATCH/DELETE /admin/endpoints. Omit to leave the
# management API unmounted.
management_token = "admin-secret"
max_body_size_bytes = 1048576
buffer_capacity = 10000
max_batch_size = 500
include_http_metadata = true
# The provider's delivery id is the dedup key a consumer needs, because
# delivery is best-effort in both directions. See the README.
forward_headers = ["X-GitHub-Delivery", "X-Request-ID"]

# Static secret-path endpoint: POST /e/{endpoint_id}. The URL is itself the
# credential, so generate it with `openssl rand -hex 16`.
[[plugin_config.endpoints]]
endpoint_id = "a3f8c2e1b9d04f7a8e6c1d2b3a4f5e6d"
auth_type = "hmac-sha256"
auth_secret = "whsec_github_example"
hmac_header = "X-Hub-Signature-256"
hmac_prefix = "sha256="
