[package]
name = "iggy_kafka_wire"
version = "0.1.0-edge.1"
description = "Kafka wire protocol codec, bounds guard and record conversion shared by Apache Iggy's Kafka hosts"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
keywords = ["iggy", "kafka", "protocol", "streaming"]
homepage = "https://iggy.apache.org"
documentation = "https://iggy.apache.org/docs"
repository = "https://github.com/apache/iggy"
readme = "README.md"
publish = false

[dependencies]
# Required by kafka-protocol: its custom-decompression hook is typed on anyhow::Result.
anyhow = { workspace = true }
bytes = { workspace = true }
# The four codecs are driven from `records::decompress` rather than through kafka-protocol,
# whose decompressors materialize the whole stream before a budget can see it.
flate2 = { workspace = true }
iggy_common = { workspace = true }
# The codec features stay on for the encoder, which the batch tests use to build fixtures.
kafka-protocol = { workspace = true, features = ["gzip", "lz4", "snappy", "zstd"] }
lz4 = { workspace = true }
secrecy = { workspace = true }
snap = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
# Repairs the CRC of a batch header a test rewrote, which the decoder checks first.
crc32c = { workspace = true }
# The client half, so a test encodes requests the way a Kafka client does.
kafka-protocol = { workspace = true, features = ["client"] }

[lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
nursery = "warn"
