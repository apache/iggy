[package]
name = "integration"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata.cargo-machete]
ignored = ["cfg_aliases"]

[features]
default = ["login-session"]
# Gates only the keyring backend of the CLI login tests. Its store is a
# dev-dependency, and a dev-dependency cannot be optional.
login-session = []

[dependencies]
async-trait = { workspace = true }
bon = { workspace = true }
compio = { workspace = true }
configs = { workspace = true }
# Decodes a metadata replica's durable `VsrState` off disk in the superblock
# recovery test.
consensus = { workspace = true }
# statvfs of the data volume, as the server's disk usage sampler reads it.
fs2 = { workspace = true }
futures = { workspace = true }
harness_derive = { workspace = true }
iggy = { workspace = true }
iggy_binary_protocol = { workspace = true }
iggy_common = { workspace = true }
# The S3 provider, which creates the buckets of the Floci fixture.
iggy_object_store = { workspace = true }
# Locates and decodes the on-disk superblock slot files in the recovery test
# (`SLOT_FILE_NAMES`, `decode_slots`).
journal = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true, features = ["http2", "json"] }
rmcp = { workspace = true, features = [
    "client",
    "reqwest",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
serde_json = { workspace = true }
# Starts Floci, the S3 store of the tests that run tiered storage on s3.
testcontainers = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
wiremock = { workspace = true }

[build-dependencies]
cfg_aliases = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytemuck = { workspace = true }
bytes = { workspace = true }
configs_derive = { workspace = true }
ctor = { workspace = true }
dtor = { workspace = true }
figment = { workspace = true }
hex = { workspace = true }
humantime = { workspace = true }
iggy-cli = { workspace = true }
jsonwebtoken = { workspace = true }
keyring-core = { workspace = true }
predicates = { workspace = true }
ring = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serial_test = { workspace = true }
server_common = { workspace = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }
test-case = { workspace = true }
twox-hash = { workspace = true }
zip = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dev-dependencies]
zbus-secret-service-keyring-store = { workspace = true }

[lints]
workspace = true
