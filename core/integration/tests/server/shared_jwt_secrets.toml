# Loaded through `config_path`, which, unlike a `server(...)` override, does
# not join the generated test names. The same secret on every node makes
# bearers valid cluster-wide.
[http.jwt]
encoding_secret = "0123456789abcdef0123456789abcdef"
decoding_secret = "0123456789abcdef0123456789abcdef"
