# Deliberately broken sink: targets an index that will never exist, with
# create_index_if_not_exists = false. Asserts that ensure_index_exists()
# fails open() with InitError against a real server, and that the runtime
# reports ConnectorStatus::Error instead of aborting startup.

type = "sink"
key = "opensearch_missing_index"
enabled = true
version = 0
name = "OpenSearch missing-index sink"
path = "../../target/debug/libiggy_connector_opensearch_sink"
verbose = true

[[streams]]
stream = "test_stream"
topics = ["test_topic"]
schema = "json"
batch_length = 100
poll_interval = "5ms"
consumer_group = "opensearch_missing_index"

[plugin_config]
url = "http://localhost:9200"
index = "iggy_this_index_does_not_exist"
create_index_if_not_exists = false
