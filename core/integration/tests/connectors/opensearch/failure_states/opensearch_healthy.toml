# Healthy companion sink: verifies that a sibling connector with valid
# configuration keeps running independently while opensearch_mapping_conflict
# absorbs a consume()-level failure (see that connector's own config comment)
# and opensearch_missing_index fails to open. Subscribes to test_topic,
# distinct from the mapping-conflict sink's test_topic_2.

type = "sink"
key = "opensearch_healthy"
enabled = true
version = 0
name = "OpenSearch healthy sink"
path = "../../target/debug/libiggy_connector_opensearch_sink"
verbose = true

[[streams]]
stream = "test_stream"
topics = ["test_topic"]
schema = "json"
batch_length = 100
poll_interval = "5ms"
consumer_group = "opensearch_healthy"

[plugin_config]
url = "http://localhost:9200"
index = "iggy_healthy"
create_index_if_not_exists = true
