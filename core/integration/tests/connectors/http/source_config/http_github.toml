# Instance 1 of a shared listener. The fixture supplies listen_addr and
# admin_listen_addr through env overrides so parallel test processes do not
# fight over a port.

type = "source"
key = "http_github"
enabled = true
version = 0
name = "HTTP source (GitHub)"
path = "../../target/debug/libiggy_connector_http_source"
plugin_config_format = "toml"

[[streams]]
stream = "test_stream"
topic = "test_topic"
schema = "raw"
batch_length = 10
linger_time = "5ms"

[plugin_config]
listen_addr = "127.0.0.1:0"
admin_listen_addr = "127.0.0.1:0"
instance_name = "http_github"
topic_path = "test_topic"
management_token = "mgmt-token-test"
buffer_capacity = 128
max_batch_size = 10
include_http_metadata = true
forward_headers = ["X-GitHub-Delivery"]

[[plugin_config.endpoints]]
endpoint_id = "a3f8c2e1b9d04f7a8e6c1d2b3a4f5e6d"
auth_type = "hmac-sha256"
auth_secret = "whsec_github_test"
hmac_header = "X-Hub-Signature-256"
hmac_prefix = "sha256="
