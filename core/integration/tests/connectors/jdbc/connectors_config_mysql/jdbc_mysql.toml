# JDBC Source Connector for MySQL

type = "source"
key = "jdbc_mysql"
enabled = true
version = 0
name = "JDBC MySQL Source"
path = "../../target/debug/libiggy_connector_jdbc_source"

[[streams]]
stream = "test_stream"
topic = "test_topic"
schema = "json"

[plugin_config]
jdbc_url = ""
driver_class = ""
driver_jar_path = ""
username = ""
password = ""
query = "SELECT id, name FROM mysql_cursor_test WHERE id > {last_offset} ORDER BY id"
poll_interval = "1s"
batch_size = 2
mode = "incremental"
tracking_column = "id"
initial_offset = "0"
snake_case_columns = false
include_metadata = true
