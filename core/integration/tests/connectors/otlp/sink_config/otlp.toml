type = "sink"
key = "otlp"
enabled = true
version = 0
name = "OTLP sink"
path = "../../target/debug/libiggy_connector_otlp_sink"
verbose = true

[[streams]]
stream = "test_stream"
topics = ["test_topic"]
schema = "raw"
batch_length = 100
consumer_group = "otlp_sink_cg"

# Fixtures override endpoint, compression and max_request_bytes through
# IGGY_CONNECTORS_SINK_OTLP_* variables.
[plugin_config]
endpoint = "http://localhost:4318"
timeout = "5s"
max_retries = 3
retry_delay = "100ms"
max_retry_delay = "200ms"
verbose_logging = true

[plugin_config.headers]
authorization = "Bearer iggy-test-token"
