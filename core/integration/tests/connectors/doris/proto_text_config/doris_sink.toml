# `DorisSinkPreCreatedFixture::connectors_runtime_envs` overrides the plugin
# path, the FE URL, the database and every `[[streams]]` key at run time, so
# those values are structural rather than meaningful. The
# `[transforms.proto_convert]` block below is the only part of this file
# specific to the test.

type = "sink"
key = "doris"
enabled = true
version = 0
name = "Doris sink"
path = "../../target/debug/libiggy_connector_doris_sink"
verbose = false

[[streams]]
stream = "test_stream"
topics = ["test_topic"]
schema = "json"
batch_length = 100
poll_interval = "5ms"
consumer_group = "doris_sink"

# No descriptor is configured, so `json_to_protobuf` falls back to proto text
# and every message reaches the sink as `Payload::Proto` holding its JSON.
[transforms.proto_convert]
enabled = true
source_format = "json"
target_format = "proto"
include_paths = []
preserve_unknown_fields = false

[transforms.proto_convert.conversion_options]
validate_messages = true
pretty_json = false
include_metadata = false
type_url_prefix = "type.googleapis.com"
strict_mode = false

[plugin_config]
fe_url = "http://localhost:8030"
database = ""
table = ""
username = "root"
password = ""
label_prefix = "iggy"
batch_size = 1000
timeout = "30s"
