# Deliberately sets only the S3 access key: build_storage_options rejects
# this before any storage backend is touched, so no MinIO/table is needed.

type = "sink"
key = "delta_missing_secret_key"
enabled = true
version = 0
name = "Delta missing secret key sink"
path = "../../target/debug/libiggy_connector_delta_sink"
verbose = true

[[streams]]
stream = "test_stream"
topics = ["test_topic"]
schema = "json"
batch_length = 100
poll_interval = "5ms"
consumer_group = "delta_missing_secret_key_sink_connector"

[plugin_config]
table_uri = "s3://iggy-sandbox/tables/test"
storage_backend_type = "s3"
aws_s3_access_key = "some-access-key"
aws_s3_region = "us-east-1"
