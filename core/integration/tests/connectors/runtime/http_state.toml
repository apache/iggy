[connectors]
config_type = "local"
config_dir = "tests/connectors/runtime/http_state_config"

# The state server URL is injected per test via IGGY_CONNECTORS_STATE_HTTP_URL.
[state]
storage = "http"

[state.http]
timeout = "2s"

[state.http.retry]
enabled = true
max_attempts = 1
initial_backoff = "10ms"
max_backoff = "50ms"
backoff_multiplier = 2
