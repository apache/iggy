# The second stream does not exist, so setup fails after the consumer of the
# first stream joined the default group, iggy-connect-sink-stdout_partial_setup.

type = "sink"
key = "stdout_partial_setup"
enabled = true
version = 0
name = "Stdout partial setup sink"
path = "../../target/debug/libiggy_connector_stdout_sink"
verbose = true

[[streams]]
stream = "test_stream"
topics = ["test_topic"]
schema = "json"
batch_length = 100

[[streams]]
stream = "no_such_stream"
topics = ["test_topic"]
schema = "json"
batch_length = 100

[plugin_config]
print_payload = true
