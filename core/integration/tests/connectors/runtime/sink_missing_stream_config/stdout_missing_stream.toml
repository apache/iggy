# Deliberately broken sink: the configured stream does not exist on the server.
# Used to assert that the Iggy error reason reaches `last_error` instead of a
# generic "Iggy error" label.

type = "sink"
key = "stdout_missing_stream"
enabled = true
version = 0
name = "Stdout missing stream sink"
path = "../../target/debug/libiggy_connector_stdout_sink"
verbose = true

[[streams]]
stream = "no_such_stream"
topics = ["test_topic"]
schema = "json"
batch_length = 100
poll_interval = "5ms"
consumer_group = "stdout_missing_stream_sink_connector"

[plugin_config]
print_payload = true
