type = "sink"
key = "offset_commit_sink"
enabled = true
version = 0
name = "Offset commit test sink"
path = "../../target/debug/libiggy_connector_test_sink"
offset_commit = "after_consuming"

[[streams]]
stream = "test_stream"
topics = ["test_topic", "test_topic_2"]
schema = "json"
batch_length = 10
poll_interval = "5ms"
consumer_group = "offset_commit_multi_topic"

[plugin_config]
fail_after_batches = 0
reject_topics = ["test_topic"]
