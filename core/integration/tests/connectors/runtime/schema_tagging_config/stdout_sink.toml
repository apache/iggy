type = "sink"
key = "stdout_schema"
enabled = true
version = 0
name = "Stdout schema tagging sink"
path = "../../target/debug/libiggy_connector_stdout_sink"
verbose = true

[[streams]]
stream = "test_stream"
topics = ["test_topic"]
schema = "avro"
avro_schema_json = '{"type":"record","name":"Event","fields":[{"name":"id","type":"long"},{"name":"name","type":"string"}]}'
batch_length = 10
poll_interval = "5ms"
consumer_group = "schema_tagging_sink_connector"

[plugin_config]
print_payload = true
