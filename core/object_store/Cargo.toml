[package]
name = "iggy_object_store"
version = "0.1.0"
description = "Object store interfaces behind Apache Iggy tiered storage"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
keywords = ["iggy", "object-store", "storage", "streaming", "tiered-storage"]
homepage = "https://iggy.apache.org"
documentation = "https://iggy.apache.org/docs"
repository = "https://github.com/apache/iggy"
publish = false

[dependencies]
arc-swap = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
compio = { workspace = true }
crc32c = { workspace = true }
cyper = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
md5 = { workspace = true }
percent-encoding = { workspace = true }
quick-xml = { workspace = true }
rand = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
send_wrapper = { workspace = true, features = ["futures"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = "warn"
# The in-memory store answers without awaiting, by design.
unused_async_trait_impl = "allow"

[lints.rust]
warnings = "deny"
