[package]
name = "iggy_object_store"
version = "0.1.0"
description = "Object store abstraction behind Apache Iggy tiered storage"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
keywords = ["iggy", "object-store", "s3", "storage", "streaming"]
homepage = "https://iggy.apache.org"
documentation = "https://iggy.apache.org/docs"
repository = "https://github.com/apache/iggy"
publish = false

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
compio = { workspace = true }
crc32c = { workspace = true }
cyper = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
md-5 = { workspace = true }
percent-encoding = { workspace = true }
quick-xml = { workspace = true, features = ["serialize"] }
rand = { workspace = true }
ring = { workspace = true }
send_wrapper = { workspace = true, features = ["futures"] }
serde = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
rustls = { workspace = true }
server_common = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }

[lints]
workspace = true
