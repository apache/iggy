# Docker Compose override for coverage collection.
# Activated by: ./scripts/run-bdd-tests.sh --coverage <sdk>
#
# Mounts a shared ../reports volume into each BDD container and overrides
# the test command with the SDK-specific coverage-instrumented variant.

services:
  rust-bdd:
    build:
      args:
        COVERAGE: "true"
    volumes:
      - ../reports:/reports
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        coverage_env=$$(cargo llvm-cov show-env --sh --remap-path-prefix)
        eval "$$coverage_env"
        trap 'cargo llvm-cov report --lcov --output-path /reports/rust-bdd-coverage.lcov' EXIT
        TEST_ARGS=()
        case "$$BDD_FEATURE" in
          basic_messaging|leader_redirection|raw_command|session_contract|stream_crud|stream_options|resource_options_patch) TEST_ARGS=(--test "$$BDD_FEATURE") ;;
        esac
        cargo test --locked -p bdd --features "$$BDD_RUST_FEATURES" "$${TEST_ARGS[@]}"

  python-bdd:
    volumes:
      - ../reports:/reports
    command:
      - sh
      - -c
      - >-
        uv run --project /workspace/bdd/python
        pytest tests/ -v
        --cov --cov-report=xml:/reports/python-bdd-coverage.xml

  php-bdd:
    volumes:
      - ../reports:/reports
    command:
      - bash
      - -lc
      - >-
        cd /workspace/foreign/php
        && source <(cargo llvm-cov show-env --sh)
        && export CARGO_TARGET_DIR=$CARGO_LLVM_COV_TARGET_DIR
        && cargo llvm-cov clean --workspace
        && cargo php install --yes
        && ./scripts/test.sh --configuration /workspace/bdd/php/phpunit.xml.dist
        && cargo llvm-cov report --lcov
        --ignore-filename-regex='(\.cargo/|/rustc/|/core/)'
        --output-path /reports/php-bdd-coverage.lcov

  go-bdd:
    volumes:
      - ../reports:/reports
    command:
      - sh
      - -c
      - >-
        go test -v
        -coverpkg=github.com/apache/iggy/foreign/go/...
        -coverprofile=/reports/go-bdd-coverage.out
        ./...

  node-bdd:
    user: "0"
    volumes:
      - ../reports:/reports
    command:
      - sh
      - -c
      - npx c8 --reporter=lcov --reports-dir=/reports/node-bdd-coverage npm run test:bdd

  csharp-bdd:
    volumes:
      - ../reports:/reports
    command:
      - sh
      - -c
      - |
        FILTER=""
        case "$$BDD_FEATURE" in
          basic_messaging)    FILTER='--filter-trait Category=basic-messaging' ;;
          leader_redirection) FILTER='--filter-trait Category=requires-leader-awareness' ;;
          stream_options)     FILTER='--filter-trait Category=stream-options' ;;
          resource_options_patch) FILTER='--filter-trait Category=resource-options-patch' ;;
          session_contract)   FILTER='--filter-trait Category=session-contract' ;;
        esac
        dotnet test $$FILTER --coverage --coverage-output-format cobertura --coverage-output csharp-bdd-coverage.cobertura.xml --results-directory /reports

  java-bdd:
    volumes:
      - ../reports:/reports
    command:
      - sh
      - -c
      - |
        case "$$BDD_FEATURE" in
          basic_messaging)    export CUCUMBER_FILTER_TAGS='@basic-messaging' ;;
          leader_redirection) export CUCUMBER_FILTER_TAGS='@requires-leader-awareness' ;;
          raw_command)        export CUCUMBER_FILTER_TAGS='@raw-command' ;;
          session_contract)   export CUCUMBER_FILTER_TAGS='@session-contract' ;;
          stream_crud)        export CUCUMBER_FILTER_TAGS='@stream-crud' ;;
          stream_options)     export CUCUMBER_FILTER_TAGS='@stream-options' ;;
          resource_options_patch) export CUCUMBER_FILTER_TAGS='@resource-options-patch' ;;
        esac
        gradle --no-daemon test jacocoTestReport && cp build/reports/jacoco/test/jacocoTestReport.xml /reports/java-bdd-coverage.xml
