services:
  rust-bdd:
    image: iggy-bdd-rust
    build:
      context: ..
      dockerfile: bdd/rust/Dockerfile
      args:
        BDD_RUST_FEATURES: ${BDD_RUST_FEATURES:-bdd}
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - BDD_FEATURE=${BDD_FEATURE:-all}
      - BDD_RUST_FEATURES=${BDD_RUST_FEATURES:-bdd}
      - RUST_LOG=debug
      - RUSTFLAGS=-C linker=gcc
    volumes:
      - ./scenarios/basic_messaging.feature:/app/features/basic_messaging.feature
      - ./scenarios/leader_redirection.feature:/app/features/leader_redirection.feature
      - ./scenarios/raw_command.feature:/app/features/raw_command.feature
      - ./scenarios/session_contract.feature:/app/features/session_contract.feature
      - ./scenarios/stream_crud.feature:/app/features/stream_crud.feature
      - ./scenarios/stream_options.feature:/app/features/stream_options.feature
      - ./scenarios/resource_options_patch.feature:/app/features/resource_options_patch.feature
      - ./scenarios/metadata_changes.feature:/app/features/metadata_changes.feature
    command:
      - sh
      - -c
      - |
        case "$$BDD_FEATURE" in
          basic_messaging)    cargo test -p bdd --features "$$BDD_RUST_FEATURES" --test basic_messaging ;;
          leader_redirection) cargo test -p bdd --features "$$BDD_RUST_FEATURES" --test leader_redirection ;;
          raw_command)        cargo test -p bdd --features "$$BDD_RUST_FEATURES" --test raw_command ;;
          session_contract)   cargo test -p bdd --features "$$BDD_RUST_FEATURES" --test session_contract ;;
          stream_crud)        cargo test -p bdd --features "$$BDD_RUST_FEATURES" --test stream_crud ;;
          stream_options)     cargo test -p bdd --features "$$BDD_RUST_FEATURES" --test stream_options ;;
          resource_options_patch) cargo test -p bdd --features "$$BDD_RUST_FEATURES" --test resource_options_patch ;;
          metadata_changes)   cargo test -p bdd --features "$$BDD_RUST_FEATURES" --test metadata_changes ;;
          *)                  cargo test -p bdd --features "$$BDD_RUST_FEATURES" ;;
        esac
    networks:
      - iggy-bdd-network

  python-bdd:
    image: iggy-bdd-python
    build:
      context: ..
      dockerfile: bdd/python/Dockerfile
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - BDD_FEATURE=${BDD_FEATURE:-all}
    volumes:
      - ./scenarios/basic_messaging.feature:/app/features/basic_messaging.feature
      - ./scenarios/raw_command.feature:/app/features/raw_command.feature
      - ./scenarios/stream_options.feature:/app/features/stream_options.feature
      - ./scenarios/resource_options_patch.feature:/app/features/resource_options_patch.feature
      - ./scenarios/metadata_changes.feature:/app/features/metadata_changes.feature
      - ./scenarios/session_contract.feature:/app/features/session_contract.feature
    working_dir: /app
    command:
      - sh
      - -c
      - |
        case "$$BDD_FEATURE" in
          basic_messaging)        TEST_PATH='tests/test_basic_messaging.py' ;;
          raw_command)            TEST_PATH='tests/test_raw_command.py' ;;
          session_contract)       TEST_PATH='tests/test_session_contract.py' ;;
          stream_options)         TEST_PATH='tests/test_stream_options.py' ;;
          resource_options_patch) TEST_PATH='tests/test_resource_options_patch.py' ;;
          metadata_changes)       TEST_PATH='tests/test_metadata_changes.py' ;;
          *)                      TEST_PATH='tests/' ;;
        esac
        uv run --project /workspace/bdd/python pytest $$TEST_PATH -v
    networks:
      - iggy-bdd-network

  php-bdd:
    build:
      context: ..
      dockerfile: bdd/php/Dockerfile
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - BDD_FEATURE=${BDD_FEATURE:-all}
    volumes:
      - ./scenarios/basic_messaging.feature:/app/features/basic_messaging.feature
      - ./scenarios/raw_command.feature:/app/features/raw_command.feature
      - ./scenarios/stream_options.feature:/app/features/stream_options.feature
      - ./scenarios/session_contract.feature:/app/features/session_contract.feature
      - ./scenarios/metadata_changes.feature:/app/features/metadata_changes.feature
    command:
      - sh
      - -c
      - |
        case "$$BDD_FEATURE" in
          basic_messaging)  GROUP='--group basic-messaging' ;;
          raw_command)      GROUP='--group raw-command' ;;
          session_contract) GROUP='--group session-contract' ;;
          stream_options)   GROUP='--group stream-options' ;;
          metadata_changes) GROUP='--group metadata-changes' ;;
          *)                GROUP='' ;;
        esac
        ./scripts/test.sh --configuration /workspace/bdd/php/phpunit.xml.dist $$GROUP
    networks:
      - iggy-bdd-network

  go-bdd:
    image: iggy-bdd-go
    build:
      context: ..
      dockerfile: bdd/go/Dockerfile
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - BDD_FEATURE=${BDD_FEATURE:-all}
      - GO_TEST_EXTRA_FLAGS=${GO_TEST_EXTRA_FLAGS:-}
    command: [ "sh", "-c", "go test -v ${GO_TEST_EXTRA_FLAGS:-} ./..." ]
    networks:
      - iggy-bdd-network

  node-bdd:
    image: iggy-bdd-node
    build:
      context: ..
      dockerfile: bdd/node/Dockerfile
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - BDD_FEATURE=${BDD_FEATURE:-all}
    command:
      - sh
      - -c
      - |
        case "$$BDD_FEATURE" in
          basic_messaging)        TAGS='--tags @basic-messaging' ;;
          raw_command)            TAGS='--tags @raw-command' ;;
          session_contract)       TAGS='--tags @session-contract' ;;
          stream_options)         TAGS='--tags @stream-options' ;;
          resource_options_patch) TAGS='--tags @resource-options-patch' ;;
          metadata_changes)       TAGS='--tags @metadata-changes' ;;
          *)                      TAGS='' ;;
        esac
        npm run test:bdd -- $$TAGS
    networks:
      - iggy-bdd-network

  csharp-bdd:
    image: iggy-bdd-csharp
    build:
      context: ..
      dockerfile: bdd/csharp/Dockerfile
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - BDD_FEATURE=${BDD_FEATURE:-all}
    command:
      - sh
      - -c
      - |
        FILTER=""
        case "$$BDD_FEATURE" in
          basic_messaging)    FILTER='--filter-trait Category=basic-messaging' ;;
          leader_redirection) FILTER='--filter-trait Category=requires-leader-awareness' ;;
          raw_command)        FILTER='--filter-trait Category=raw-command' ;;
          stream_options)     FILTER='--filter-trait Category=stream-options' ;;
          resource_options_patch) FILTER='--filter-trait Category=resource-options-patch' ;;
          metadata_changes)   FILTER='--filter-trait Category=metadata-changes' ;;
          session_contract)   FILTER='--filter-trait Category=session-contract' ;;
        esac
        dotnet test $$FILTER
    networks:
      - iggy-bdd-network

  java-bdd:
    image: iggy-bdd-java
    build:
      context: ..
      dockerfile: bdd/java/Dockerfile
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - BDD_FEATURE=${BDD_FEATURE:-all}
    volumes:
      - ./scenarios/basic_messaging.feature:/app/features/basic_messaging.feature
      - ./scenarios/leader_redirection.feature:/app/features/leader_redirection.feature
      - ./scenarios/raw_command.feature:/app/features/raw_command.feature
      - ./scenarios/session_contract.feature:/app/features/session_contract.feature
      - ./scenarios/stream_crud.feature:/app/features/stream_crud.feature
      - ./scenarios/stream_options.feature:/app/features/stream_options.feature
      - ./scenarios/resource_options_patch.feature:/app/features/resource_options_patch.feature
      - ./scenarios/metadata_changes.feature:/app/features/metadata_changes.feature
    command:
      - sh
      - -c
      - |
        case "$$BDD_FEATURE" in
          basic_messaging)    export CUCUMBER_FILTER_TAGS='@basic-messaging' ;;
          leader_redirection) export CUCUMBER_FILTER_TAGS='@requires-leader-awareness' ;;
          raw_command)        export CUCUMBER_FILTER_TAGS='@raw-command' ;;
          session_contract)   export CUCUMBER_FILTER_TAGS='@session-contract' ;;
          stream_crud)        export CUCUMBER_FILTER_TAGS='@stream-crud' ;;
          stream_options)     export CUCUMBER_FILTER_TAGS='@stream-options' ;;
          resource_options_patch) export CUCUMBER_FILTER_TAGS='@resource-options-patch' ;;
          metadata_changes)   export CUCUMBER_FILTER_TAGS='@metadata-changes' ;;
        esac
        gradle --no-daemon test
    networks:
      - iggy-bdd-network

  cpp-bdd:
    image: iggy-bdd-cpp
    build:
      context: ..
      dockerfile: bdd/cpp/Dockerfile
    environment:
      - IGGY_ROOT_USERNAME=iggy
      - IGGY_ROOT_PASSWORD=iggy
      - BDD_FEATURE=${BDD_FEATURE:-all}
    volumes:
      - ./scenarios/basic_messaging.feature:/app/features/basic_messaging.feature
      - ./scenarios/raw_command.feature:/app/features/raw_command.feature
      - ./scenarios/stream_options.feature:/app/features/stream_options.feature
      - ./scenarios/resource_options_patch.feature:/app/features/resource_options_patch.feature
      - ./scenarios/metadata_changes.feature:/app/features/metadata_changes.feature
      - ./scenarios/session_contract.feature:/app/features/session_contract.feature
    networks:
      - iggy-bdd-network

networks:
  iggy-bdd-network:
    driver: bridge
