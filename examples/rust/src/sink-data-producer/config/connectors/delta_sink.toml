type = "sink"
key = "delta"
enabled = true
version = 0
name = "Delta Lake sink"
path = "libiggy_connector_delta_sink"
verbose = true

[[streams]]
stream = "example_stream"
topics = ["users"]
schema = "json"
batch_length = 1000
poll_interval = "1s"
consumer_group = "delta_sink_connector"

[plugin_config]
table_uri = "s3://delta-warehouse/users"
storage_backend_type = "s3"
# Local test credentials of the floci S3 emulator, not real AWS keys.
aws_s3_access_key = "test"
aws_s3_secret_key = "test"
aws_s3_region = "us-east-1"
aws_s3_endpoint_url = "http://floci:4566"
aws_s3_allow_http = true
