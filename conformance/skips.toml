# The skips and the known divergences that each SDK is allowed, each with a
# tracking issue. See conformance/README.md. A skip looks like this:
#
# [[skip]]
# sdk = "swift"
# test = "<file path>#<test description>"
# issue = "https://github.com/apache/iggy/issues/NNNN"

[[divergence]]
sdk = "go"
test = "streams/stream_crud.yaml#Delete a stream."
