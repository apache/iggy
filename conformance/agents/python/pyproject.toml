[project]
name = "iggy-conformance-agent"
version = "0.1.0"
description = "The conformance agent of the Iggy Python SDK"
requires-python = ">=3.11"
dependencies = ["apache-iggy"]

# The agent tests the SDK of the same commit, so it builds the SDK from the tree.
[tool.uv.sources]
apache-iggy = { path = "../../../foreign/python" }

[tool.uv]
exclude-newer = "7 days"

[tool.ruff.lint]
select = ["S", "B", "E", "F", "W", "I", "T10", "C4", "ARG", "SIM", "UP"]
