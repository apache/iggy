# No Gherkin feature covered topics on their own. This file uses only methods that every agent
# already had, so it needed no agent change.
schema_version: "1.0"
description: An SDK creates, reads, lists, renames and deletes a topic by its numeric id.
initial_data:
  - name: create_stream
    arguments: {name: orders}

tests:
  - description: Create a topic with explicit settings and read them back.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: create_topic
        arguments:
          stream_id: orders
          name: events
          partitions_count: 2
          message_expiry: 3600000000
          max_topic_size: 1073741824
        expect_result:
          id: {$$capture: topic_id}
          name: events
          partitions_count: 2
          messages_count: 0
          partitions:
            - {id: 0, current_offset: 0, messages_count: 0}
            - {id: 1, current_offset: 0, messages_count: 0}
          options:
            message_expiry: {value: "3600000000", explicit: true}
            max_topic_size: {value: "1073741824", explicit: true}
      - object: client0
        name: get_topic
        arguments: {stream_id: orders, topic_id: {$$ref: topic_id}}
        expect_result:
          id: {$$ref: topic_id}
          name: events
          partitions: {$$len: 2}
          options:
            message_expiry: {value: "3600000000", explicit: true}

  - description: List the topics of a stream.
    create_entities:
      - client: {id: client0}
    operations:
      - object: admin
        name: create_topic
        arguments: {stream_id: orders, name: first, partitions_count: 1}
      - object: admin
        name: create_topic
        arguments: {stream_id: orders, name: second, partitions_count: 3}
      - object: client0
        name: get_topics
        arguments: {stream_id: orders}
        expect_result:
          $$unordered:
            - {name: first, partitions_count: 1}
            - {name: second, partitions_count: 3}

  - description: Rename a topic and keep its settings.
    create_entities:
      - client: {id: client0}
    operations:
      - object: admin
        name: create_topic
        arguments: {stream_id: orders, name: before, partitions_count: 1, message_expiry: 3600000000}
        expect_result: {id: {$$capture: topic_id}}
      - object: client0
        name: update_topic
        arguments: {stream_id: orders, topic_id: {$$ref: topic_id}, name: after}
      - object: client0
        name: get_topic
        arguments: {stream_id: orders, topic_id: {$$ref: topic_id}}
        expect_result:
          name: after
          options:
            message_expiry: {value: "3600000000", explicit: true}

  - description: Delete a topic.
    create_entities:
      - client: {id: client0}
    operations:
      - object: admin
        name: create_topic
        arguments: {stream_id: orders, name: doomed, partitions_count: 1}
        expect_result: {id: {$$capture: topic_id}}
      - object: client0
        name: delete_topic
        arguments: {stream_id: orders, topic_id: {$$ref: topic_id}}
      - object: client0
        name: get_topics
        arguments: {stream_id: orders}
        expect_result: []
    outcome:
      - name: get_stream
        arguments: {stream_id: orders}
        expect_result: {topics_count: 0, topics: []}
