schema_version: "1.0"
description: An SDK creates, reads, lists, renames and deletes a stream by its numeric id.

tests:
  - description: Create a stream.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: create_stream
        arguments: {name: stream-crud-create}
        expect_result:
          id: {$$capture: stream_id}
          name: stream-crud-create
          topics_count: 0
          messages_count: 0
          size_bytes: 0
          topics: []
      - object: client0
        name: get_stream
        arguments: {stream_id: {$$ref: stream_id}}
        expect_result: {id: {$$ref: stream_id}, name: stream-crud-create}

  - description: Get a stream by its numeric id.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: create_stream
        arguments: {name: stream-crud-get}
        expect_result: {id: {$$capture: stream_id}}
      - object: client0
        name: get_stream
        arguments: {stream_id: {$$ref: stream_id}}
        expect_result: {id: {$$ref: stream_id}, name: stream-crud-get, topics: []}

  - description: List streams.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: create_stream
        arguments: {name: stream-crud-list}
        expect_result: {id: {$$capture: stream_id}}
      - object: client0
        name: get_streams
        expect_result:
          - {id: {$$ref: stream_id}, name: stream-crud-list, topics_count: 0}

  - description: Rename a stream.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: create_stream
        arguments: {name: stream-crud-update}
        expect_result: {id: {$$capture: stream_id}}
      - object: client0
        name: update_stream
        arguments: {stream_id: {$$ref: stream_id}, name: stream-crud-updated}
      - object: client0
        name: get_stream
        arguments: {stream_id: {$$ref: stream_id}}
        expect_result: {name: stream-crud-updated}

  - description: Delete a stream.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: create_stream
        arguments: {name: stream-crud-delete}
        expect_result: {id: {$$capture: stream_id}}
      - object: client0
        name: delete_stream
        arguments: {stream_id: {$$ref: stream_id}}
      - object: client0
        name: get_stream
        arguments: {stream_id: {$$ref: stream_id}}
        expect_result: null
    outcome:
      - name: get_streams
        expect_result: []
