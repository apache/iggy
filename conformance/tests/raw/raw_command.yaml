# Converted from bdd/scenarios/raw_command.feature.
schema_version: "1.0"
description: >-
  An SDK sends a command code with a payload directly, so that an application can call a
  command that has no typed SDK method.
run_on:
  - capabilities: [raw_command]

tests:
  - description: Known command codes round-trip.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: send_binary_request
        arguments: {code: 1}
        expect_result: {payload_hex: ""}
      - object: client0
        name: send_binary_request
        arguments: {code: 10}
        expect_result: {payload_hex: {$$len: {$$gte: 2}}}

  - description: An unknown command code is rejected.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: send_binary_request
        arguments: {code: 60000}
        expect_error: {name: invalid_command}

  - description: A session control command code is rejected.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: send_binary_request
        arguments: {code: 38}
        expect_error: {name: invalid_command}

  - description: A raw command goes to a chosen replica.
    run_on:
      - capabilities: [raw_command_replica]
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: send_binary_request_to_replica
        arguments: {code: 10, replica: 0}
        expect_result: {payload_hex: {$$len: {$$gte: 2}}}
      - object: client0
        name: send_binary_request_to_replica
        arguments: {code: 10, replica: 9}
        expect_error: {name: invalid_identifier}
      - object: client0
        name: send_binary_request_to_replica
        arguments: {code: 202, replica: 0}
        expect_error: {name: invalid_command}
