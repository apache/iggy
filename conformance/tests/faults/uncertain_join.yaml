# Ported from given_an_uncertain_join_when_building_again_should_abandon_it_and_join_again
# in core/sdk/src/clients/reader/cluster_tests.rs, which runs against a scripted fake server.
schema_version: "1.0"
description: >-
  A consumer group join that the network loses fails as uncertain, and the SDK abandons it at
  once. The next build sends a new join with a new request number.
run_on:
  - transports: [tcp]
    capabilities: [reader]
initial_data:
  - name: create_stream
    arguments: {name: orders}
  - name: create_topic
    arguments: {stream_id: orders, name: events, partitions_count: 3}
  - name: create_consumer_group
    arguments: {stream_id: orders, topic_id: events, name: readers}

tests:
  - description: The build fails as uncertain, and the next build joins again with a new request number.
    create_entities:
      - client: {id: client0, through_proxy: true}
    operations:
      - object: proxy
        name: fail_frames
        arguments:
          client: client0
          match: {command: consumer_group.join}
          action: drop_request
      - object: client0
        name: build_reader
        arguments: {stream_id: orders, topic_id: events, consumer: {group: readers}}
        save_result_as: reader0
        expect_error: {name: operation_uncertain, operation_id: {$$capture: lost}}
      - object: client0
        name: build_reader
        arguments: {stream_id: orders, topic_id: events, consumer: {group: readers}}
        save_result_as: reader0
    expect_frames:
      - client: client0
        commands: [consumer_group.join]
        direction: request
        frames:
          - {request: {$$ref: lost}, outcome: dropped}
          - {request: {$$not: {$$ref: lost}}, outcome: forwarded}
    outcome:
      - name: get_consumer_group
        arguments: {stream_id: orders, topic_id: events, group_id: readers}
        expect_result: {members_count: 1}
