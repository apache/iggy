schema_version: "1.0"
description: >-
  Every SDK ends a call with the same error code when it has no session or no
  primary, so an application handles a sign-out and an unavailable cluster the
  same way in every language.

tests:
  - description: A call after sign-out fails as unauthenticated.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: logout_user
      - object: client0
        name: get_stream
        arguments: {stream_id: 1}
        expect_error: {name: unauthenticated}

  - description: A sign-in that no primary accepts fails at its deadline.
    run_on:
      - topology: no_quorum
    create_entities:
      - client: {id: client0, node: no_quorum, login: none}
    operations:
      - object: client0
        name: login_user
        arguments:
          username: {$$ref: root_username}
          password: {$$ref: root_password}
        expect_error: {name: transient_not_accepted}
