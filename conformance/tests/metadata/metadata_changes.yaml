# Converted from bdd/scenarios/metadata_changes.feature. Each test takes its cursor after the
# purge of the server, so a follow returns only the changes of the test itself. A two-phase
# delete records its change when it completes, so the follows read until the change arrives.
schema_version: "1.0"
description: >-
  An operator reads the metadata changes that the server committed, so that a mirror of
  streams, topics, users and sessions stays current without listing everything again.
run_on:
  - capabilities: [metadata_changes]
initial_data:
  - name: create_user
    arguments:
      username: changes-reader
      password: changes-secret
      permissions: {global: {read_servers: true}}

tests:
  - description: Follow stream changes from the latest position.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: get_metadata_changes
        arguments: {start: latest, groups: [streams]}
        expect_result: {status: ok, records: [], next: {$$capture: cursor}}
      - object: admin
        name: create_stream
        arguments: {name: changes-follow}
        expect_result: {id: {$$capture: stream_id}}
      - object: admin
        name: update_stream
        arguments: {stream_id: {$$ref: stream_id}, name: changes-follow-renamed}
      - object: admin
        name: delete_stream
        arguments: {stream_id: {$$ref: stream_id}}
      - object: client0
        name: get_metadata_changes
        arguments: {start: {after: {$$ref: cursor}}, groups: [streams], limit: 100}
        eventually: 10s
        expect_result:
          status: ok
          records:
            - {kind: stream_created, stream_id: {$$ref: stream_id}, name: changes-follow, actor_user_id: 0}
            - {kind: stream_updated, stream_id: {$$ref: stream_id}, name: changes-follow-renamed, actor_user_id: 0}
            - {kind: stream_deleted, stream_id: {$$ref: stream_id}, actor_user_id: 0}

  - description: Filter changes by group.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: get_metadata_changes
        arguments: {start: latest, groups: [topics]}
        expect_result: {status: ok, next: {$$capture: cursor}}
      - object: admin
        name: create_stream
        arguments: {name: changes-filter}
        expect_result: {id: {$$capture: stream_id}}
      - object: admin
        name: create_topic
        arguments: {stream_id: changes-filter, name: events, partitions_count: 1}
      - object: client0
        name: get_metadata_changes
        arguments: {start: {after: {$$ref: cursor}}, groups: [topics], limit: 100}
        eventually: 10s
        expect_result:
          status: ok
          records:
            - {kind: topic_created, stream_id: {$$ref: stream_id}, name: events}

  - description: Record a two-phase delete at its completion.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: get_metadata_changes
        arguments: {start: latest, groups: [streams]}
        expect_result: {status: ok, next: {$$capture: cursor}}
      - object: admin
        name: create_stream
        arguments: {name: changes-two-phase}
        expect_result: {id: {$$capture: stream_id}}
      - object: admin
        name: create_topic
        arguments: {stream_id: changes-two-phase, name: events, partitions_count: 1}
      - object: admin
        name: delete_stream
        arguments: {stream_id: {$$ref: stream_id}}
      - object: client0
        name: get_metadata_changes
        arguments: {start: {after: {$$ref: cursor}}, groups: [streams], limit: 100}
        eventually: 10s
        expect_result:
          status: ok
          records:
            - {kind: stream_created, stream_id: {$$ref: stream_id}}
            - kind: stream_deleted
              stream_id: {$$ref: stream_id}
              op: {$$capture: deleted_op}
              requested_op: {$$lte: {$$ref: deleted_op}}

  - description: Keyed stream changes carry fingerprints and no key.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: get_metadata_changes
        arguments: {start: latest, groups: [streams]}
        expect_result: {status: ok, next: {$$capture: cursor}}
      - object: admin
        name: create_stream
        arguments:
          name: changes-keyed
          encryption_key_hex: "1515151515151515151515151515151515151515151515151515151515151515"
      - object: client0
        name: get_metadata_changes
        arguments: {start: {after: {$$ref: cursor}}, groups: [streams], limit: 100}
        eventually: 10s
        expect_result:
          status: ok
          records:
            - kind: stream_created
              name: changes-keyed
              options:
                encryption_key_source: {value: stream}
                encryption_key_fingerprint: {value: 7f39654f15560771}
                encryption_key: {$$exists: false}
                encryption_key_wrapped: {$$exists: false}

  - description: Rebuild from current state after the cursor expired.
    create_entities:
      - client: {id: client0}
    operations:
      - object: client0
        name: get_metadata_changes
        arguments: {start: latest, groups: [streams]}
        expect_result: {status: ok, next: {$$capture: cursor}}
      - {object: admin, name: create_stream, arguments: {name: changes-churn-0}}
      - {object: admin, name: delete_stream, arguments: {stream_id: changes-churn-0}}
      - {object: admin, name: create_stream, arguments: {name: changes-churn-1}}
      - {object: admin, name: delete_stream, arguments: {stream_id: changes-churn-1}}
