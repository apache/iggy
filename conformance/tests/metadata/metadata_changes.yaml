      - {object: admin, name: delete_stream, arguments: {stream_id: changes-churn-39}}
      - object: admin
        name: create_stream
        arguments: {name: changes-kept}
        expect_result: {id: {$$capture: kept_id}}
      - object: client0
        name: get_metadata_changes
        arguments: {start: {after: {$$ref: cursor}}, groups: [streams], limit: 100}
        expect_result: {status: expired, records: [], next: null}
      - object: client0
        name: get_metadata_changes
        arguments: {start: {current: null}, groups: [streams], limit: 100}
        expect_result:
          status: ok
          has_more: false
          items: [{group: streams, stream_id: {$$ref: kept_id}, name: changes-kept}]
          next: {$$capture: anchor}
      - object: client0
        name: get_streams
        expect_result: [{id: {$$ref: kept_id}, name: changes-kept}]
      - object: client0
        name: get_metadata_changes
        arguments: {start: {after: {$$ref: anchor}}, groups: [streams], limit: 100}
        expect_result: {status: ok}

  - description: Reading changes needs the manage servers permission.
    create_entities:
      - client: {id: reader, login: {username: changes-reader, password: changes-secret}}
    operations:
      - object: reader
        name: get_metadata_changes
        arguments: {start: earliest, groups: [streams]}
        expect_error: {name: unauthorized}
