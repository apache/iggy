# Every intended difference between what a real client observed on the gateway and what it
# observed on Apache Kafka, read by client_matrix_tests.rs. An undeclared difference fails the
# run, and so does an entry here that no longer occurs. `scenario` is `client/<client>` as the
# matrix names it; `issue` is the apache/iggy issue number that owns the gap, or a `KW-` plan
# task where no issue exists yet.
#
# No differences are declared at present: every client in the matrix matches Apache Kafka.
