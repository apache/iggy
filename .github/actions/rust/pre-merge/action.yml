name: rust-pre-merge
description: Rust pre-merge testing and linting github iggy actions

inputs:
  task:
    description: "Task to run (check, check-msrv, fmt, clippy, clippy-macos-aarch64, sort, machete, doctest, verify-publish, runtime, test-build, test, test-storage-compat, miri)"
    required: true
  component:
    description: "Component name (for context)"
    required: false
    default: ""
  test-scope:
    description: "Test selection: affected or workspace"
    required: false
    default: affected
  partition:
    description: "One-based nextest partition index for the test task"
    required: false
  partitions:
    description: "Total nextest partitions for the test task"
    required: false
  save-cache:
    description: "Save build dependencies for subsequent PRs"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: ./.github/actions/utils/setup-rust
      with:
        # Test and Miri jobs execute nextest.
        install-nextest: ${{ inputs.task == 'miri' || inputs.task == 'test' || startsWith(inputs.task, 'test-') }}
        coverage: ${{ inputs.task == 'runtime' || inputs.task == 'test-build' || inputs.task == 'test' }}
        # These tasks do not compile workspace crates and need no native
        # libraries. All compiling tasks keep the existing dependency setup.
        install-system-dependencies: ${{ inputs.task != 'fmt' && inputs.task != 'sort' && inputs.task != 'machete' }}
        # Miri builds against a nightly toolchain with a separate `target/miri`
        # subtree; isolate its cache from the stable `dev` namespace so the
        # two don't evict each other.
        # check-msrv stays on `dev`: only `dev` and `runtime` are ever saved
        # (by coverage-baseline), so a dedicated key would be cold every run. It
        # reads only (pre-merge save-cache=false), so it cannot churn `dev`;
        # the warm `~/.cargo` restore is a free win, and its 1.95 target
        # artifacts rebuild regardless since the rustc hash differs.
        shared-key: ${{ inputs.task == 'miri' && 'miri' || inputs.task == 'runtime' && 'runtime' || 'dev' }}
        # Shards download the build artifact. Metadata-only tasks need no target cache.
        read-cache: ${{ (inputs.task == 'fmt' || inputs.task == 'sort' || inputs.task == 'machete' || inputs.task == 'test') && 'false' || 'true' }}
        save-cache: ${{ inputs.save-cache }}
        # Artifact builders do not pull test containers. Keep cleanup on the
        # test shards and other disk-heavy jobs.
        free-disk-space: ${{ (inputs.task == 'runtime' || inputs.task == 'test-build' || inputs.task == 'miri' || inputs.task == 'fmt' || inputs.task == 'sort' || inputs.task == 'clippy' || inputs.task == 'check' || inputs.task == 'check-msrv' || inputs.task == 'machete' || inputs.task == 'doctest') && 'false' || 'true' }}

    - name: Install cargo-sort
      if: inputs.task == 'sort'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-sort

    - name: Install cargo-machete
      if: inputs.task == 'machete'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-machete

    # cargo-http-registry has no prebuilt artifact in taiki-e/install-action,
    # so it stays a source build. verify-publish is a low-frequency task.
    - name: Install tools for specific tasks
      if: inputs.task == 'verify-publish'
      run: |
        if ! command -v cargo-http-registry >/dev/null 2>&1; then
          cargo install cargo-http-registry --locked
        fi
      shell: bash

    # Planning is an optimization. A planner or selector failure restores the
    # full-workspace build and test path below. The Action installs the one
    # Cargo-Rail release it is qualified with (0.30.1 for v10.1.1).
    - name: Plan affected Rust work
      id: rail
      if: inputs.task == 'test-build' && inputs.test-scope == 'affected'
      continue-on-error: true
      uses: loadingalias/cargo-rail-action@409962f05d90a78aae995ef6b1c8466010c0a460 # v10.1.1

    # Individual lint tasks for parallel execution
    - name: Cargo check
      if: inputs.task == 'check'
      run: cargo check --all --all-features
      shell: bash

    # MSRV gate: compile-check the published crates against the declared
    # workspace `rust-version`. The MSRV is read from Cargo.toml so this stays
    # in sync with the single source of truth. The `+<msrv>` override beats the
    # rust-toolchain.toml pin. check-only: downstream consumers compile our
    # libs (not our tests), so dev-deps needing newer Rust are out of scope.
    - name: Cargo check on MSRV
      if: inputs.task == 'check-msrv'
      run: |
        MSRV=$(grep -oP -m1 '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)
        echo "::notice::Checking published crates against MSRV ${MSRV}"
        rustup toolchain install "$MSRV" --profile minimal --no-self-update
        cargo "+$MSRV" check --locked --all-features \
          -p iggy -p iggy_common -p iggy_binary_protocol -p iggy-cli
      shell: bash

    - name: Cargo fmt
      if: inputs.task == 'fmt'
      run: cargo fmt --all -- --check
      shell: bash

    # clippy-macos-aarch64 runs the same lint on macos-14. Code behind
    # cfg(target_os) splits is dead to the Linux leg, so its warnings would
    # otherwise reach master unseen.
    - name: Cargo clippy
      if: inputs.task == 'clippy' || inputs.task == 'clippy-macos-aarch64'
      run: cargo clippy --all-targets --all-features -- -D warnings
      shell: bash

    - name: Cargo sort
      if: inputs.task == 'sort'
      run: cargo sort --check --no-format --workspace
      shell: bash

    - name: Cargo machete
      if: inputs.task == 'machete'
      run: cargo machete --with-metadata
      shell: bash

    - name: Doc test
      if: inputs.task == 'doctest'
      env:
        RUSTDOCFLAGS: -D warnings
      run: |
        cargo test --locked --doc
        cargo doc --no-deps --all-features --quiet
      shell: bash

    - name: Verify crates publish chain to local alt-registry
      if: inputs.task == 'verify-publish'
      env:
        CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      run: ./scripts/verify-crates-publish.sh
      shell: bash

    - name: Install dependencies for Rust tests
      if: (inputs.task == 'test' || inputs.task == 'test-storage-compat') && runner.os == 'Linux'
      run: |
        ./scripts/ci/apt-install.sh musl-tools gnome-keyring keyutils dbus-x11 libsecret-tools
        rm -f "$HOME"/.local/share/keyrings/*
      shell: bash

    - name: Download runtime binaries
      if: inputs.task == 'test' || inputs.task == 'test-storage-compat'
      uses: ./.github/actions/utils/download-runtime
      with:
        restore: "false"

    - name: Build coverage artifacts
      if: inputs.task == 'runtime' || inputs.task == 'test-build'
      env:
        PLAN_FILE: ${{ steps.rail.outputs.plan-file }}
        PLAN_STATUS: ${{ steps.rail.outcome }}
        TEST_SELECTION: ${{ inputs.test-scope }}
        ARTIFACT_TASK: ${{ inputs.task }}
      run: |
        set -euo pipefail
        ARTIFACT_DIR="$RUNNER_TEMP/rust-$ARTIFACT_TASK"
        mkdir -p "$ARTIFACT_DIR"

        git rev-parse HEAD > "$ARTIFACT_DIR/revision"
        if [[ "$ARTIFACT_TASK" == runtime ]]; then
          # Workspace target selection keeps the dependency feature graph stable across SDK PRs.
          cargo build --locked --bin iggy-server --bin iggy
          tar --zstd -cf "$ARTIFACT_DIR/runtime.tar.zst" target/debug/iggy-server target/debug/iggy
          exit 0
        fi

        SELECTOR_DIR="$RUNNER_TEMP/cargo-rail-selectors"
        mkdir -p "$SELECTOR_DIR"
        TEST_ARCHIVE_ARGS=()
        TEST_PACKAGES=()
        RUNTIME_PACKAGES=()
        if [[ "$TEST_SELECTION" == workspace ]]; then
          TEST_SCOPE=workspace
          RUNTIME_SCOPE=workspace
        elif [[ "$TEST_SELECTION" != affected ]]; then
          echo "::error::Invalid test scope: $TEST_SELECTION"
          exit 1
        elif [[ "$PLAN_STATUS" == success ]] &&
          TEST_SCOPE=$(cargo-rail-action plan cargo-scope "$PLAN_FILE" cargo.test) &&
          RUNTIME_SCOPE=$(cargo-rail-action plan cargo-scope "$PLAN_FILE" runtime-artifacts) &&
          cargo-rail-action plan target-args "$PLAN_FILE" cargo.test > "$SELECTOR_DIR/test-target-args" &&
          cargo-rail-action plan package-names "$PLAN_FILE" cargo.test > "$SELECTOR_DIR/test-packages" &&
          cargo-rail-action plan package-names "$PLAN_FILE" runtime-artifacts > "$SELECTOR_DIR/runtime-packages"; then
          # NUL-delimited selectors preserve package and argument boundaries.
          mapfile -d '' -t TEST_PACKAGES < "$SELECTOR_DIR/test-packages"
          mapfile -d '' -t RUNTIME_PACKAGES < "$SELECTOR_DIR/runtime-packages"
        else
          TEST_SCOPE=workspace
          RUNTIME_SCOPE=workspace
          echo "::warning::Cargo-Rail plan unavailable or invalid; running the full workspace"
        fi
        printf '%s\n' "$TEST_SCOPE" > "$ARTIFACT_DIR/scope"
        if [[ "$TEST_SCOPE" == skipped ]]; then
          echo "::notice::Cargo-Rail reports no affected Rust tests"
          exit 0
        fi

        if [[ "$TEST_SCOPE" == packages ]]; then
          # Cargo-Rail narrows targets only through --test NAME pairs; otherwise
          # every test binary in the selected packages remains eligible.
          ARCHIVE_FILTER=$(jq -nr \
            --rawfile packages "$SELECTOR_DIR/test-packages" \
            --rawfile targets "$SELECTOR_DIR/test-target-args" '
            ($packages | split("\u0000")[:-1] |
              map("package(=\(.))") | join(" | ")) as $packages |
            ($targets | split("\u0000")[:-1] | to_entries |
              map(select(.key % 2 == 1) | "binary(=\(.value))") |
              join(" | ")) as $targets |
            if $targets == "" then $packages
            else "(\($packages)) & kind(test) & (\($targets))" end')
          TEST_ARCHIVE_ARGS=(-E "$ARCHIVE_FILTER")
        fi

        # SDKs need only server/CLI. Keep Rust-only binaries and plugins with their tests.
        BUILD_RUNTIME=false
        if [[ "$RUNTIME_SCOPE" == workspace ]]; then
          BUILD_RUNTIME=true
        elif [[ "$RUNTIME_SCOPE" == packages ]]; then
          for package in "${RUNTIME_PACKAGES[@]}"; do
            if [[ "$package" != server && "$package" != iggy-cli ]]; then
              BUILD_RUNTIME=true
              break
            fi
          done
        fi

        : > "$ARTIFACT_DIR/runtime-files"
        if [[ "$BUILD_RUNTIME" == true ]]; then
          # Match the cache producer's dependency features even for affected-package runs.
          cargo build --locked --workspace --exclude server --exclude iggy-cli \
            --message-format=json-render-diagnostics > "$ARTIFACT_DIR/build.jsonl"
          RUNTIME_PACKAGE_IDS='[]'
          if [[ "$RUNTIME_SCOPE" == packages ]]; then
            RUNTIME_PACKAGE_IDS=$(cargo metadata --locked --no-deps --format-version 1 |
              jq --rawfile packages "$SELECTOR_DIR/runtime-packages" '
                ($packages | split("\u0000")[:-1]) as $names |
                [.packages[] | select(.name as $name | $names | index($name)) | .id]')
          fi
          jq -r --arg scope "$RUNTIME_SCOPE" --argjson packages "$RUNTIME_PACKAGE_IDS" '
            select(.reason == "compiler-artifact") |
            select($scope == "workspace" or (.package_id as $id | $packages | index($id))) |
            (select(.target.kind | index("bin")) | .executable // empty),
            (select(.target.crate_types | index("cdylib")) | .filenames[] | select(endswith(".so")))' \
            "$ARTIFACT_DIR/build.jsonl" | sort -u | \
            while IFS= read -r artifact; do
              realpath --relative-to="$GITHUB_WORKSPACE" "$artifact"
            done > "$ARTIFACT_DIR/runtime-files"
          rm "$ARTIFACT_DIR/build.jsonl"
        fi
        tar --zstd -cf "$ARTIFACT_DIR/runtime.tar.zst" -T "$ARTIFACT_DIR/runtime-files"
        rm "$ARTIFACT_DIR/runtime-files"

        # api_handler_tests, version_firewall_tests, and server_e2e_tests need gitignored
        # wire fixtures. Master always generates them. On PRs, use the selected
        # packages or the gateway diff to avoid building fixture tools unnecessarily.
        NEEDS_KAFKA_FIXTURES=false
        if [[ "$TEST_SELECTION" == "workspace" ]]; then
          NEEDS_KAFKA_FIXTURES=true
        elif [[ "$TEST_SCOPE" == "packages" ]]; then
          for package in "${TEST_PACKAGES[@]}"; do
            if [[ "$package" == "iggy-gateway-kafka" ]]; then
              NEEDS_KAFKA_FIXTURES=true
              break
            fi
          done
        else
          # HEAD on a pull_request run is the synthetic merge commit; its first parent is
          # the base tip GitHub merged against. The depth-1 checkout holds that parent only
          # as a shallow boundary: `HEAD^1` does not resolve and `origin/master...HEAD` has
          # no merge base (so it failed on every full-workspace lane). Read the parent from
          # the raw object and fetch that one commit before diffing. A HEAD with one parent
          # (workflow_dispatch on a branch tip) has no PR base, so it takes the fail-safe.
          #
          # `2>&1` into a variable, not `2>/dev/null` piped straight to grep: the old form
          # silenced *any* git failure into empty output, which `grep -q` then reads
          # identically to "diff succeeded, no gateways/ changes" - so a broken diff and a
          # clean diff produced the same "skip fixtures" outcome. Confirmed in CI run
          # 32256598833: gateways/-only PR, full-workspace lane, fixtures silently skipped,
          # KAFKA_FIXTURES_REQUIRED never set - every fixture-backed test quietly passed by
          # skipping all its assertions instead of running them (0.005s for a test meant to
          # decode 9 real fixtures).
          BASE_SHA=""
          if [[ "$(git cat-file -p HEAD | grep -c '^parent ')" -eq 2 ]]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          if [[ -n "$BASE_SHA" ]] \
            && DIFF_OUTPUT=$(git fetch -q --no-tags --depth=1 origin "$BASE_SHA" 2>&1 \
              && git diff --name-only "$BASE_SHA" HEAD 2>&1); then
            if grep -qE '^gateways/' <<< "$DIFF_OUTPUT"; then
              NEEDS_KAFKA_FIXTURES=true
            else
              echo "::notice::Skipping Kafka wire fixtures (full suite, gateways/** unchanged)"
            fi
          else
            # No PR base, or fetch/diff failed - NOT the same as "no gateways/ changes".
            # Generate unconditionally as the fail-safe default; this is the case the bug
            # above collapsed into a silent skip.
            NEEDS_KAFKA_FIXTURES=true
            echo "::warning::git diff against the PR base failed (base: ${BASE_SHA:-none, HEAD is not a merge commit}; ${DIFF_OUTPUT:-}); generating Kafka fixtures unconditionally as a fail-safe"
          fi
        fi
        printf '%s\n' "$NEEDS_KAFKA_FIXTURES" > "$ARTIFACT_DIR/kafka-fixtures"
        if [[ "$NEEDS_KAFKA_FIXTURES" == true ]]; then
          ./gateways/kafka/scripts/ci-wire-fixtures.sh generate
          tar --zstd -cf "$ARTIFACT_DIR/kafka-fixtures.tar.zst" gateways/kafka/tools/kafka-tool/kafka_messages
        fi

        # Filtering the archive preserves the workspace compilation graph.
        cargo nextest archive --locked --profile ci --workspace \
          "${TEST_ARCHIVE_ARGS[@]}" \
          --archive-file "$ARTIFACT_DIR/nextest.tar.zst"
      shell: bash

    - name: Run coverage test partition
      if: inputs.task == 'test'
      env:
        # Keep these out of TEST_* and IGGY_*. They reach every test process,
        # where config env tests panic on unknown TEST_* names and debug
        # servers refuse to boot on unknown IGGY_* names.
        PARTITION_INDEX: ${{ inputs.partition }}
        PARTITION_COUNT: ${{ inputs.partitions }}
      run: |
        set -euo pipefail
        if [[ ! "$PARTITION_INDEX" =~ ^[1-9][0-9]*$ || ! "$PARTITION_COUNT" =~ ^[1-9][0-9]*$ ]] ||
          (( PARTITION_INDEX > PARTITION_COUNT )); then
          echo "::error::Invalid test partition: $PARTITION_INDEX/$PARTITION_COUNT"
          exit 1
        fi
        ARTIFACT_DIR="$RUNNER_TEMP/rust-test-build"
        artifact_revision=$(cat "$ARTIFACT_DIR/revision")
        checkout_revision=$(git rev-parse HEAD)
        if [[ "$artifact_revision" != "$checkout_revision" ]]; then
          echo "::error::Coverage archive revision $artifact_revision does not match checkout $checkout_revision"
          exit 1
        fi
        TEST_SCOPE=$(cat "$ARTIFACT_DIR/scope")
        if [[ "$TEST_SCOPE" == "skipped" ]]; then
          echo "::notice::Cargo-Rail reports no affected Rust tests"
          exit 0
        fi
        if [[ "$(cat "$ARTIFACT_DIR/kafka-fixtures")" == true ]]; then
          tar --zstd -xf "$ARTIFACT_DIR/kafka-fixtures.tar.zst"
          # Fixtures are expected to exist from here on; a missing one now means
          # generation silently failed, not a legitimate local-dev skip.
          export KAFKA_FIXTURES_REQUIRED=1
          # Same reasoning for the real-client suite: Docker and a built iggy-server are both
          # present in this job, so a skip here means the prerequisite broke rather than a
          # legitimate local-dev skip, and an unarmed guard would report a pass over zero
          # assertions.
          export KAFKA_E2E_REQUIRED=1
          # Pull the client images here rather than letting the first test pull them. A cold
          # runner fetches ~400 MB for the Kafka distribution, and inside a test that competes
          # with nextest's per-test kill budget, so a slow registry surfaces as a test timeout
          # naming the feature under test instead of naming the pull. The suite runs its
          # containers with --pull never, so a failed pull here makes it skip, which the guard
          # above turns into a job failure that names the missing image.
          # Read the tags out of the suite itself; hardcoding them here lets a bump in the test
          # desync silently, which pre-pulls the superseded image and puts the real one back
          # inside the budget this block exists to avoid.
          E2E_IMAGES=$(grep -oP '^const (KCAT|KAFKA)_IMAGE: &str = "\K[^"]+' \
            gateways/kafka/tests/kafka_client_e2e_tests.rs)
          if [[ -z "$E2E_IMAGES" ]]; then
            echo "::warning::could not read client image tags from kafka_client_e2e_tests.rs; skipping pre-pull"
          fi
          for image in $E2E_IMAGES; do
            timeout 300 docker pull -q "$image" \
              || echo "::warning::docker pull $image failed; the real-client suite will fail naming it"
          done
        fi

        # Start D-Bus and unlock keyring right before test execution to avoid
        # gnome-keyring auto-locking the collection during the build phase.
        # Previously this ran before `cargo build`, leaving a 7+ minute idle
        # window that triggered org.freedesktop.Secret.Error.IsLocked ~10% of runs.
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          eval "$(dbus-launch --sh-syntax)"
          export DBUS_SESSION_BUS_ADDRESS
          eval "$(echo -n "test" | gnome-keyring-daemon --unlock --components=secrets)"
          echo -n "warmup" | secret-tool store --label="ci-warmup" ci-test warmup
        fi

        # Doris requires this host setting before its testcontainers fixture starts.
        sudo sysctl -w vm.max_map_count=2000000 || true
        NO_TESTS=fail
        if [[ "$TEST_SCOPE" == "packages" ]]; then
          # BDD targets require features, so a BDD-only scope can contain no runnable tests.
          NO_TESTS=warn
        fi
        # nextest can archive non-test binaries with dev-dependency features.
        # Restore the shared runtime last so every suite executes the same binaries.
        tar --zstd -xf "$ARTIFACT_DIR/nextest.tar.zst"
        tar --zstd -xf "$ARTIFACT_DIR/runtime.tar.zst"
        ./scripts/ci/restore-runtime.sh "$RUNNER_TEMP/rust-runtime"
        cargo nextest run \
          --cargo-metadata target/nextest/cargo-metadata.json \
          --binaries-metadata target/nextest/binaries-metadata.json \
          --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
          --no-fail-fast --no-tests="$NO_TESTS" --profile ci \
          --partition "hash:${PARTITION_INDEX}/${PARTITION_COUNT}"
      shell: bash

    # Compare the shared HEAD runtime with a separately built baseline server.
    - name: Storage format backwards compatibility
      if: inputs.task == 'test-storage-compat'
      run: ./scripts/ci/storage-compat.sh --runtime-artifacts "$RUNNER_TEMP/rust-runtime"
      shell: bash

    # Miri (UB detector) on the unsafe-heavy crates that don't pull tokio /
    # compio. Pinned nightly so MIRIFLAGS behavior is stable across CI runs;
    # bump the date quarterly. Tree-borrows is the future-default aliasing
    # model and accepts the legitimate `NonNull::add` arithmetic in
    # `iobuf.rs` that stacked-borrows would reject. Strict-provenance
    # rejects int-to-pointer round trips, which we don't use.
    - name: Run miri
      if: inputs.task == 'miri'
      env:
        MIRI_TOOLCHAIN: nightly-2026-10-23
        MIRIFLAGS: "-Zmiri-tree-borrows -Zmiri-strict-provenance"
      run: |
        rustup toolchain install "$MIRI_TOOLCHAIN" --component miri --profile minimal --no-self-update
        TIMEFORMAT='Miri sysroot setup: %3R seconds'
        time cargo +"$MIRI_TOOLCHAIN" miri setup
        miri_args=(--locked -p iggy_binary_protocol -p consensus)
        TIMEFORMAT='Miri test compilation: %3R seconds'
        time cargo +"$MIRI_TOOLCHAIN" miri nextest run --no-run "${miri_args[@]}"
        TIMEFORMAT='Miri tests: %3R seconds'
        time cargo +"$MIRI_TOOLCHAIN" miri nextest run "${miri_args[@]}"
        # Nextest does not run doctests.
        TIMEFORMAT='Miri doctests: %3R seconds'
        time cargo +"$MIRI_TOOLCHAIN" miri test --doc "${miri_args[@]}"
      shell: bash

    # aarch64 builds (run on ARM64 runners)
    - name: Build aarch64-gnu
      if: inputs.task == 'build-aarch64-gnu'
      run: cargo build --locked
      shell: bash

    - name: Install musl tools for aarch64-musl
      if: inputs.task == 'build-aarch64-musl' && runner.os == 'Linux'
      run: |
        ./scripts/ci/apt-install.sh musl-tools
        rustup target add aarch64-unknown-linux-musl
      shell: bash

    - name: Build aarch64-musl
      if: inputs.task == 'build-aarch64-musl'
      # Exclude dashboard crates: charming's "ssr" feature pulls deno_core -> v8,
      # which has no prebuilt binary for aarch64-unknown-linux-musl.
      # TODO: support when upstream rusty_v8 publishes aarch64-musl binaries.
      run: >-
        cargo build --locked --workspace --target aarch64-unknown-linux-musl
        --exclude iggy-bench-dashboard-server
        --exclude bench-dashboard-frontend
      shell: bash
      env:
        PKG_CONFIG_ALLOW_CROSS: "1"
        PKG_CONFIG_ALL_STATIC: "1"
        # liblzma-sys links the system liblzma when pkg-config reports 5.8 or
        # newer, and the glibc library dir it adds shadows the musl libc.
        LZMA_API_STATIC: "1"

    # macOS builds
    - name: Build macOS aarch64
      if: inputs.task == 'build-macos-aarch64'
      run: cargo build --locked
      shell: bash

    # macOS is build-only everywhere else in CI, so runtime regressions in the
    # non-Linux driver path (kqueue instead of io_uring) would ship unnoticed.
    # Boot the freshly built server and ping it over TCP. The server refuses
    # to boot without root credentials, while ping itself is pre-auth. The
    # retry flags keep each attempt bounded regardless of CLI reconnection
    # defaults, so a dead server fails the step fast instead of hanging until
    # the job timeout.
    - name: Smoke test iggy-server boot on macOS
      if: inputs.task == 'build-macos-aarch64'
      run: |
        target/debug/iggy-server --fresh --with-default-root-credentials > server-boot.log 2>&1 &
        SERVER_PID=$!
        stop_server() {
          local stop_timeout=30
          kill "$SERVER_PID" 2>/dev/null || true
          for ((elapsed = 0; elapsed < stop_timeout; elapsed++)); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill -KILL "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" || true
        }
        trap stop_server EXIT

        for _ in $(seq 1 30); do
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::iggy-server exited before answering ping"
            cat server-boot.log
            exit 1
          fi
          if target/debug/iggy \
              --tcp-reconnection-max-retries 1 \
              --tcp-reconnection-interval 500ms \
              ping; then
            echo "Server booted and answered ping"
            exit 0
          fi
          sleep 2
        done

        echo "::error::iggy-server did not answer ping within 60s"
        cat server-boot.log
        exit 1
      shell: bash

    # Windows builds (SDK and CLI only - iggy-server does not support Windows)
    - name: Build Windows SDK and CLI
      if: inputs.task == 'build-windows-sdk'
      run: cargo build --locked -p iggy -p iggy-cli
      shell: bash
