name: java-gradle-pre-merge
description: Java Gradle pre-merge testing github iggy actions

inputs:
  task:
    description: "Task to run (lint, test, build)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: ./.github/actions/utils/setup-java
      with:
        gradle-cache-disabled: "true"

    - name: Lint SDK
      if: inputs.task == 'lint'
      shell: bash
      working-directory: foreign/java
      run: |
        echo "::group::Linting foreign/java"
        TIMEFORMAT='Java SDK lint: %3R seconds'
        time ./gradlew check -x test
        echo "::endgroup::"

    - name: Lint examples
      if: inputs.task == 'lint'
      shell: bash
      working-directory: examples/java
      run: |
        echo "::group::Linting examples/java"
        TIMEFORMAT='Java examples lint: %3R seconds'
        time ./gradlew check -x test
        echo "::endgroup::"

    - name: Lint BDD
      if: inputs.task == 'lint'
      shell: bash
      working-directory: bdd/java
      run: |
        echo "::group::Linting bdd/java"
        TIMEFORMAT='Java BDD lint: %3R seconds'
        time ./gradlew check -x test
        echo "::endgroup::"

    - name: Build
      shell: bash
      if: inputs.task == 'build'
      working-directory: foreign/java
      run: |
        TIMEFORMAT='Java build: %3R seconds'
        time ./gradlew build -x test -x checkstyleMain -x checkstyleTest -x spotlessCheck
        echo ""
        echo "Build artifacts:"
        find . -path "*/build/libs/*.jar" -type f 2>/dev/null | head -20 || echo "No jar artifacts found in build/libs directories"

    - name: Download runtime binaries
      if: inputs.task == 'test'
      uses: ./.github/actions/utils/download-runtime

    - name: Start Iggy server
      if: inputs.task == 'test'
      id: iggy
      uses: ./.github/actions/utils/server-start
      with:
        bin: target/debug/iggy-server
        encryption-enabled: "true"
        encryption-key: "/rvT1xP4V8u1EAhk4xDdqzqM2UOPXyy9XYkl4uRShgE="
        wait-timeout-seconds: "90"
      env:
        IGGY_PATH: ${{ runner.temp }}/iggy-java-data

    - name: Test
      if: inputs.task == 'test'
      shell: bash
      working-directory: foreign/java
      env:
        USE_EXTERNAL_SERVER: true
      run: |
        TIMEFORMAT='Java test compilation: %3R seconds'
        time ./gradlew testClasses
        TIMEFORMAT='Java tests: %3R seconds'
        time ./gradlew test

    - name: Check for ByteBuf leaks
      if: ${{ !cancelled() && inputs.task == 'test' }}
      shell: bash
      run: |
        if grep -r "LEAK:" foreign/java/java-sdk/build/test-results/ 2>/dev/null; then
          echo "::error::Netty ByteBuf memory leaks detected in test output!"
          exit 1
        fi
        echo "No ByteBuf leaks detected"

    - name: Generate coverage report
      if: inputs.task == 'test'
      shell: bash
      working-directory: foreign/java
      env:
        USE_EXTERNAL_SERVER: true
      run: |
        TIMEFORMAT='Java coverage report: %3R seconds'
        time ./gradlew jacocoAggregatedReport

    - name: Copy coverage reports
      if: ${{ !cancelled() && inputs.task == 'test' }}
      shell: bash
      run: |
        if [ -f "foreign/java/build/reports/jacoco/aggregate/jacocoAggregated.xml" ]; then
          echo "Found aggregated coverage report"
          mkdir -p reports/java-coverage
          cp foreign/java/build/reports/jacoco/aggregate/jacocoAggregated.xml reports/java-coverage/
          if [ -d "foreign/java/build/reports/jacoco/aggregate/html" ]; then
            cp -r foreign/java/build/reports/jacoco/aggregate/html reports/java-coverage/
          fi
        fi

    - name: Copy test reports
      if: ${{ !cancelled() && inputs.task == 'test' }}
      shell: bash
      run: |
        if [ -d "foreign/java/java-sdk/build/test-results" ]; then
          echo "Found test reports in java-sdk"
          mkdir -p reports/java-tests
          cp -r foreign/java/java-sdk/build/test-results reports/java-tests/sdk
        fi
        if [ -d "foreign/java/external-processors/iggy-connector-flink/iggy-connector-library/build/test-results" ]; then
          echo "Found test reports in flink"
          mkdir -p reports/java-tests
          cp -r foreign/java/external-processors/iggy-connector-flink/iggy-connector-library/build/test-results reports/java-tests/flink
        fi
        if [ -d "foreign/java/external-processors/iggy-connector-pinot/build/test-results" ]; then
          echo "Found test reports in pinot"
          mkdir -p reports/java-tests
          cp -r foreign/java/external-processors/iggy-connector-pinot/build/test-results reports/java-tests/pinot
        fi

    - name: Stop Iggy server
      if: always() && inputs.task == 'test'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy.outputs.pid_file }}
        log-file: ${{ steps.iggy.outputs.log_file }}

    # No encryption key, the shipped default, so this lane also covers a server
    # that keeps streams plaintext and refuses client stream keys.
    - name: Start Iggy server (TLS)
      id: iggy-tls
      if: inputs.task == 'test'
      uses: ./.github/actions/utils/server-start
      with:
        bin: target/debug/iggy-server
        wait-timeout-seconds: "90"
        pid-file: ${{ runner.temp }}/iggy-server-tls.pid
        log-file: ${{ runner.temp }}/iggy-server-tls.log
      env:
        IGGY_PATH: ${{ runner.temp }}/iggy-java-tls-data
        IGGY_TCP_TLS_ENABLED: "true"
        IGGY_TCP_TLS_CERT_FILE: core/certs/iggy_cert.pem
        IGGY_TCP_TLS_KEY_FILE: core/certs/iggy_key.pem

    - name: TLS integration tests
      if: inputs.task == 'test'
      shell: bash
      working-directory: foreign/java
      env:
        USE_EXTERNAL_SERVER: true
        IGGY_TCP_TLS_ENABLED: "true"
      run: |
        TIMEFORMAT='Java TLS tests: %3R seconds'
        time ./gradlew :iggy:test --tests "*TlsConnectionTest*"

    - name: Stop Iggy server (TLS)
      if: always() && inputs.task == 'test'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy-tls.outputs.pid_file }}
        log-file: ${{ steps.iggy-tls.outputs.log_file }}

    - name: Test Summary
      uses: test-summary/action@v2
      with:
        paths: |
          foreign/java/java-sdk/build/test-results/**/TEST-*.xml
          foreign/java/external-processors/iggy-connector-flink/iggy-connector-library/build/test-results/**/TEST-*.xml
          foreign/java/external-processors/iggy-connector-pinot/build/test-results/**/TEST-*.xml
      if: ${{ !cancelled() && inputs.task == 'test' }}
