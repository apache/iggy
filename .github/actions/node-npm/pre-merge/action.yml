name: node-npm-pre-merge
description: Node.js pre-merge testing github iggy actions

inputs:
  task:
    description: "Task to run (lint, test, build, e2e)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "24"
        registry-url: "https://registry.npmjs.org"
        package-manager-cache: false

    - name: Pin npm to 11 to match Dependabot lockfile format
      run: npm install -g npm@11
      shell: bash

    - name: Download runtime binaries
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/download-runtime

    - name: Install netcat
      if: inputs.task == 'e2e'
      run: ./scripts/ci/apt-install.sh netcat-openbsd
      shell: bash

    - name: Install dependencies
      run: |
        cd foreign/node
        npm ci --ignore-scripts
      shell: bash

    - name: Lint
      if: inputs.task == 'lint'
      run: |
        cd foreign/node
        npm run lint

        # Also lint examples/node if it exists
        if [ -f "${GITHUB_WORKSPACE}/examples/node/package.json" ]; then
          echo "Linting examples/node..."
          cd "${GITHUB_WORKSPACE}/examples/node"
          npm ci --ignore-scripts
          npm run lint
        fi
      shell: bash

    - name: Build
      if: inputs.task == 'build'
      run: |
        cd foreign/node
        npm run build

        # Verify build output
        if [ -d "dist" ]; then
          echo "Build output:"
          ls -la dist/
        else
          echo "Warning: dist directory not found after build"
        fi
      shell: bash
    - name: Test
      if: inputs.task == 'test'
      run: |
        cd foreign/node
        mkdir -p ../../reports/node-coverage/unit
        npx c8 --reporter=lcov --reports-dir=../../reports/node-coverage/unit npm run test:unit
      shell: bash

    - name: Start Iggy server
      id: iggy
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        bin: target/debug/iggy-server
        encryption-enabled: "true"
        encryption-key: "/rvT1xP4V8u1EAhk4xDdqzqM2UOPXyy9XYkl4uRShgE="
        wait-timeout-seconds: "90"

    - name: E2E tests
      if: inputs.task == 'e2e'
      run: |
        cd foreign/node
        mkdir -p ../../reports/node-coverage/e2e
        npx c8 --reporter=lcov --reports-dir=../../reports/node-coverage/e2e npm run test:e2e
      shell: bash

    - name: Stop Iggy server
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy.outputs.pid_file }}
        log-file: ${{ steps.iggy.outputs.log_file }}

    - name: Upload server logs
      if: always() && inputs.task == 'e2e'
      uses: actions/upload-artifact@v7
      with:
        name: iggy-node-server-logs
        path: ${{ steps.iggy.outputs.log_file }}
        if-no-files-found: ignore

    - name: Start Iggy server (shipped default)
      id: iggy-default
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        bin: target/debug/iggy-server
        pid-file: ${{ runner.temp }}/iggy-server-default.pid
        log-file: ${{ runner.temp }}/iggy-server-default.log
      env:
        IGGY_PATH: ${{ runner.temp }}/iggy-node-default-data

    # The resource options suites need a server key, so they run on the lanes above.
    - name: E2E tests (shipped default)
      if: inputs.task == 'e2e'
      run: |
        cd foreign/node
        node --import @swc-node/register/esm-register --test --test-force-exit \
          $(ls src/e2e/*.e2e.ts | grep -v -e resource-options -e tls.system)
      shell: bash

    - name: Stop Iggy server (shipped default)
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy-default.outputs.pid_file }}
        log-file: ${{ steps.iggy-default.outputs.log_file }}

    # Both replicas of the roster in `core/server/config.toml`: a two-replica
    # cluster commits on 2 acks, so a lone node commits nothing. The suite then
    # reads through the client's partition routing.
    - name: Start Iggy VSR cluster node 0
      id: iggy-cluster-0
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        bin: target/debug/iggy-server
        encryption-enabled: "true"
        encryption-key: "/rvT1xP4V8u1EAhk4xDdqzqM2UOPXyy9XYkl4uRShgE="
        replica-id: "0"
        pid-file: ${{ runner.temp }}/iggy-node-cluster-0.pid
        log-file: ${{ runner.temp }}/iggy-node-cluster-0.log
        wait-timeout-seconds: "90"
      env:
        IGGY_CLUSTER_ENABLED: "true"
        IGGY_PATH: ${{ runner.temp }}/iggy-node-cluster-0-data

    - name: Start Iggy VSR cluster node 1
      id: iggy-cluster-1
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        bin: target/debug/iggy-server
        encryption-enabled: "true"
        encryption-key: "/rvT1xP4V8u1EAhk4xDdqzqM2UOPXyy9XYkl4uRShgE="
        replica-id: "1"
        tcp_address: 127.0.0.1:8091
        http_address: 127.0.0.1:3001
        pid-file: ${{ runner.temp }}/iggy-node-cluster-1.pid
        log-file: ${{ runner.temp }}/iggy-node-cluster-1.log
        wait-timeout-seconds: "90"
      env:
        IGGY_CLUSTER_ENABLED: "true"
        IGGY_PATH: ${{ runner.temp }}/iggy-node-cluster-1-data

    - name: E2E tests (cluster)
      if: inputs.task == 'e2e'
      run: |
        cd foreign/node
        node --import @swc-node/register/esm-register --test --test-force-exit \
          $(ls src/e2e/*.e2e.ts | grep -v -e tls.system)
      shell: bash

    - name: Stop Iggy VSR cluster node 1
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy-cluster-1.outputs.pid_file }}
        log-file: ${{ steps.iggy-cluster-1.outputs.log_file }}

    - name: Stop Iggy VSR cluster node 0
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy-cluster-0.outputs.pid_file }}
        log-file: ${{ steps.iggy-cluster-0.outputs.log_file }}

    - name: Start Iggy server (TLS)
      id: iggy-tls
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        bin: target/debug/iggy-server
        encryption-key: "/rvT1xP4V8u1EAhk4xDdqzqM2UOPXyy9XYkl4uRShgE="
        pid-file: ${{ runner.temp }}/iggy-server-tls.pid
        log-file: ${{ runner.temp }}/iggy-server-tls.log
      env:
        IGGY_TCP_TLS_ENABLED: "true"
        IGGY_TCP_TLS_CERT_FILE: core/certs/iggy_cert.pem
        IGGY_TCP_TLS_KEY_FILE: core/certs/iggy_key.pem

    - name: TLS E2E tests
      if: inputs.task == 'e2e'
      run: |
        cd foreign/node
        node --import @swc-node/register/esm-register --test src/e2e/tls.system.e2e.ts
      env:
        IGGY_TCP_TLS_ENABLED: "true"
        IGGY_TCP_ADDRESS: 127.0.0.1:8090
      shell: bash

    - name: Stop Iggy server (TLS)
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy-tls.outputs.pid_file }}
        log-file: ${{ steps.iggy-tls.outputs.log_file }}
