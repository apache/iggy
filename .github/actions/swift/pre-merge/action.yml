name: swift-pre-merge
description: Swift pre-merge testing github iggy actions

inputs:
  task:
    description: "Task to run (lint, test, build, build-macos, golden, e2e)"
    required: true

runs:
  using: "composite"
  steps:
    # The macOS lane uses the Swift that ships with Xcode on the runner, and
    # the golden lane only runs the Rust generator.
    - name: Setup Swift
      if: inputs.task != 'build-macos' && inputs.task != 'golden'
      uses: ./.github/actions/utils/setup-swift

    # swift-format ships with the toolchain; the configuration lives in
    # foreign/swift/.swift-format.
    - name: Format Check
      shell: bash
      if: inputs.task == 'lint'
      run: |
        cd foreign/swift
        swift format lint --strict --recursive Sources Tests Package.swift

    # A warning-free build is the lint gate the Swift compiler provides: the
    # SDK builds in Swift 6 language mode with strict concurrency checking.
    - name: Build with warnings as errors
      shell: bash
      if: inputs.task == 'lint'
      run: |
        cd foreign/swift
        swift build -Xswiftc -warnings-as-errors

    # The end-to-end suite skips itself while IGGY_TCP_ADDRESS is unset,
    # so this runs the unit and fake-server suites only.
    - name: Test
      shell: bash
      if: inputs.task == 'test'
      run: |
        cd foreign/swift
        swift test --parallel

    - name: Build
      shell: bash
      if: inputs.task == 'build'
      run: |
        cd foreign/swift
        swift build -c release

    # The manifest declares the Apple platforms, so one lane compiles and tests
    # on macOS with Xcode's toolchain rather than trusting the Linux build.
    - name: Build and test on macOS
      shell: bash
      if: inputs.task == 'build-macos'
      run: |
        cd foreign/swift
        swift --version
        swift build -Xswiftc -warnings-as-errors
        swift test --parallel

    # The generator is a small standalone workspace that needs no system
    # packages, and the workspace cache never matches its dependency set, so
    # the lane skips the disk cleanup, the apt install, and the cache restore.
    - name: Setup Rust for the golden vectors
      if: inputs.task == 'golden'
      uses: ./.github/actions/utils/setup-rust
      with:
        free-disk-space: "false"
        read-cache: "false"
        install-system-dependencies: "false"

    # The generator sits outside the root workspace, so the repo-wide fmt and
    # clippy runs never see it. The golden fixture is checked in, so this lane
    # then regenerates it from the Rust crates and fails when the two differ;
    # otherwise the Swift tests stay green against a stale copy of the protocol.
    - name: Check the golden vectors match the Rust crates
      shell: bash
      if: inputs.task == 'golden'
      run: |
        cargo fmt --manifest-path foreign/swift/Tools/golden-vectors/Cargo.toml -- --check
        cargo clippy --manifest-path foreign/swift/Tools/golden-vectors/Cargo.toml --all-targets -- -D warnings
        cargo run --manifest-path foreign/swift/Tools/golden-vectors/Cargo.toml -- foreign/swift/Tests/IggyTests/Fixtures/golden.json
        if ! git diff --exit-code -- foreign/swift/Tests/IggyTests/Fixtures/golden.json; then
          echo "❌ golden.json is out of date; regenerate it with the command above and commit the result"
          exit 1
        fi
        echo "✅ golden.json matches the Rust crates"

    - name: Setup Rust for e2e
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/setup-rust

    - name: Build the end-to-end suite
      shell: bash
      if: inputs.task == 'e2e'
      run: |
        cd foreign/swift
        swift build --build-tests

    # The SDK speaks the VSR wire protocol, so every e2e lane runs against a
    # locally built VSR server.
    - name: Start Iggy server (plain)
      id: iggy
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        cargo-bin: iggy-server
        replica-id: "0"
        pid-file: ${{ runner.temp }}/iggy-swift-e2e.pid
        log-file: ${{ runner.temp }}/iggy-swift-e2e.log
        wait-timeout-seconds: "90"
      env:
        IGGY_PATH: ${{ runner.temp }}/iggy-swift-e2e-data

    - name: Run e2e tests
      shell: bash
      if: inputs.task == 'e2e'
      env:
        IGGY_TCP_ADDRESS: 127.0.0.1:8090
        IGGY_ROOT_USERNAME: iggy
        IGGY_ROOT_PASSWORD: iggy
      run: |
        echo "🧪 Running Swift e2e tests..."
        cd foreign/swift
        swift test --skip-build --filter IggyE2ETests

    - name: Stop Iggy server (plain)
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy.outputs.pid_file }}
        log-file: ${{ steps.iggy.outputs.log_file }}

    - name: Start Iggy server (TLS)
      id: iggy-tls
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        cargo-bin: iggy-server
        replica-id: "0"
        pid-file: ${{ runner.temp }}/iggy-swift-e2e-tls.pid
        log-file: ${{ runner.temp }}/iggy-swift-e2e-tls.log
        wait-timeout-seconds: "90"
      env:
        IGGY_PATH: ${{ runner.temp }}/iggy-swift-e2e-tls-data
        IGGY_TCP_TLS_ENABLED: "true"
        IGGY_TCP_TLS_CERT_FILE: core/certs/iggy_cert.pem
        IGGY_TCP_TLS_KEY_FILE: core/certs/iggy_key.pem

    - name: Run TLS e2e tests
      shell: bash
      if: inputs.task == 'e2e'
      env:
        IGGY_TCP_ADDRESS: 127.0.0.1:8090
        IGGY_TCP_TLS_ENABLED: "true"
        IGGY_ROOT_USERNAME: iggy
        IGGY_ROOT_PASSWORD: iggy
      run: |
        echo "🔐 Running Swift e2e tests over TLS..."
        cd foreign/swift
        swift test --skip-build --filter IggyE2ETests

    - name: Stop Iggy server (TLS)
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy-tls.outputs.pid_file }}
        log-file: ${{ steps.iggy-tls.outputs.log_file }}

    # Both replicas of the roster in `core/server/config.toml`: a two-replica
    # cluster commits on two acks, so a lone node would commit nothing. The
    # suite then runs the cluster paths for real: sign-in through the
    # roster, data connections to partition primaries bound with
    # BindSession, and the session they share.
    - name: Start Iggy VSR cluster node 0
      id: iggy-cluster-0
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        cargo-bin: iggy-server
        replica-id: "0"
        pid-file: ${{ runner.temp }}/iggy-swift-cluster-0.pid
        log-file: ${{ runner.temp }}/iggy-swift-cluster-0.log
        wait-timeout-seconds: "90"
      env:
        IGGY_CLUSTER_ENABLED: "true"
        IGGY_PATH: ${{ runner.temp }}/iggy-swift-cluster-0-data

    - name: Start Iggy VSR cluster node 1
      id: iggy-cluster-1
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        cargo-bin: iggy-server
        replica-id: "1"
        tcp_address: 127.0.0.1:8091
        http_address: 127.0.0.1:3001
        pid-file: ${{ runner.temp }}/iggy-swift-cluster-1.pid
        log-file: ${{ runner.temp }}/iggy-swift-cluster-1.log
        wait-timeout-seconds: "90"
      env:
        IGGY_CLUSTER_ENABLED: "true"
        IGGY_PATH: ${{ runner.temp }}/iggy-swift-cluster-1-data

    - name: Run cluster e2e tests
      shell: bash
      if: inputs.task == 'e2e'
      env:
        IGGY_TCP_ADDRESS: 127.0.0.1:8090
        IGGY_ROOT_USERNAME: iggy
        IGGY_ROOT_PASSWORD: iggy
      run: |
        echo "🗳️ Running Swift e2e tests against a two-node cluster..."
        cd foreign/swift
        swift test --skip-build --filter IggyE2ETests

    - name: Stop Iggy VSR cluster node 1
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy-cluster-1.outputs.pid_file }}
        log-file: ${{ steps.iggy-cluster-1.outputs.log_file }}

    - name: Stop Iggy VSR cluster node 0
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy-cluster-0.outputs.pid_file }}
        log-file: ${{ steps.iggy-cluster-0.outputs.log_file }}
