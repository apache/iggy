name: conformance-pre-merge
description: Run the conformance corpus against the agent of one SDK
inputs:
  component:
    required: true
    description: Conformance component
  task:
    required: true
    description: Conformance task, conformance-<sdk>

runs:
  using: composite
  steps:
    - name: Download runtime binaries
      uses: ./.github/actions/utils/download-runtime
      with:
        install-system-dependencies: "false"

    - name: Setup Go
      if: inputs.task == 'conformance-go'
      uses: ./.github/actions/utils/setup-go

    # The Python and C++ agents build the Rust SDK through pyo3 and cxx.
    - name: Setup Rust for the wrapped SDKs
      if: inputs.task == 'conformance-python' || inputs.task == 'conformance-cpp'
      uses: ./.github/actions/utils/setup-rust
      with:
        free-disk-space: "false"

    - name: Setup uv
      if: inputs.task == 'conformance-python'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - name: Setup .NET
      if: inputs.task == 'conformance-csharp'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "10.0.x"

    - name: Setup Java
      if: inputs.task == 'conformance-java'
      uses: ./.github/actions/utils/setup-java

    - name: Setup Node
      if: inputs.task == 'conformance-node'
      uses: ./.github/actions/utils/setup-node

    - name: Setup Swift
      if: inputs.task == 'conformance-swift'
      uses: ./.github/actions/utils/setup-swift
      with:
        package-path: conformance/agents/swift/agent
        cache-key: conformance-agent

    - name: Run the conformance corpus
      shell: bash
      env:
        TASK: ${{ inputs.task }}
      run: ./scripts/run-conformance-tests.sh "${TASK#conformance-}"

    - name: Write the matrix of this SDK to the job summary
      if: always()
      shell: bash
      run: |
        if compgen -G 'reports/conformance-*.json' > /dev/null; then
          target/debug/iggy-conformance matrix reports/conformance-*.json >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: conformance-reports-${{ inputs.task }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/conformance-*
        if-no-files-found: ignore
        retention-days: 7
