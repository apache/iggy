name: download-runtime
description: >-
  Restore coverage-instrumented runtime binaries for this workflow revision.
  In .github/workflows/_detect.yml, needsRuntime must select the caller's
  task, and in .github/workflows/pre-merge.yml the caller's job must need
  runtime.

inputs:
  restore:
    description: Extract and verify the archive after downloading
    default: "true"
  install-system-dependencies:
    description: Install libraries for running the binaries on the host
    default: "true"

runs:
  using: composite
  steps:
    - name: Install runtime libraries
      if: inputs.install-system-dependencies == 'true'
      shell: bash
      run: |
        missing=()
        for package in libhwloc-dev libudev-dev; do
          if [[ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null)" != 'install ok installed' ]]; then
            missing+=("$package")
          fi
        done
        if (( ${#missing[@]} )); then
          ./scripts/ci/apt-install.sh "${missing[@]}"
        fi

    - name: Download runtime archive
      uses: actions/download-artifact@v8
      with:
        name: rust-runtime-${{ github.run_id }}
        path: ${{ runner.temp }}/rust-runtime

    - name: Verify and restore runtime binaries
      if: inputs.restore == 'true'
      shell: bash
      run: ./scripts/ci/restore-runtime.sh "$RUNNER_TEMP/rust-runtime"
