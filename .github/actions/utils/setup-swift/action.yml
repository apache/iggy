name: setup-swift
description: Install the Swift toolchain and cache SwiftPM build products
inputs:
  swift-version:
    description: "Swift toolchain version to install"
    required: false
    default: "6.1"
  cache-key:
    description: "Extra cache key segment, one per package that builds in the job"
    required: false
    default: "sdk"

runs:
  using: "composite"
  steps:
    - name: Install Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ inputs.swift-version }}

    - name: Print Swift version
      shell: bash
      run: swift --version

    # Package.resolved pins the dependency graph, so the resolved checkouts
    # and the compiled dependencies are a stable cache key.
    - name: Cache SwiftPM dependencies
      uses: actions/cache@v6.1.0
      with:
        path: |
          foreign/swift/.build/checkouts
          foreign/swift/.build/repositories
          examples/swift/getting-started/.build/checkouts
          examples/swift/getting-started/.build/repositories
          bdd/swift/tests/.build/checkouts
          bdd/swift/tests/.build/repositories
        key: swiftpm-${{ runner.os }}-${{ inputs.swift-version }}-${{ inputs.cache-key }}-${{ hashFiles('foreign/swift/Package.resolved', 'examples/swift/getting-started/Package.resolved', 'bdd/swift/tests/Package.resolved') }}
        restore-keys: |
          swiftpm-${{ runner.os }}-${{ inputs.swift-version }}-${{ inputs.cache-key }}-
