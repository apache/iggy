name: go-pre-merge
description: Go pre-merge testing github iggy actions

inputs:
  task:
    description: "Task to run (lint, test, build, e2e)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: ./.github/actions/utils/setup-go-with-cache

    - name: Format Check
      shell: bash
      if: inputs.task == 'lint'
      run: |
        for dir in foreign/go bdd/go examples/go; do
          if [ -d "$dir" ]; then
            echo "Checking formatting in $dir..."
            if [ -n "$(gofmt -l "$dir")" ]; then
              echo "::error::Go files in $dir are not formatted. Run 'gofmt -w -s $dir'"
              gofmt -d "$dir"
              exit 1
            fi
          fi
        done

    - name: Tidy Check
      shell: bash
      if: inputs.task == 'test' || inputs.task == 'lint'
      run: |
        for dir in foreign/go bdd/go examples/go; do
          if [ -f "$dir/go.mod" ]; then
            echo "Checking go mod tidy in $dir..."
            (cd "$dir" && go mod tidy && git diff --exit-code go.mod go.sum)
          fi
        done

    - name: Check Generated Code
      shell: bash
      if: inputs.task == 'test'
      run: |
        cd foreign/go
        go generate ./...
        git diff --exit-code errors/errors_gen.go

    - name: Test
      shell: bash
      if: inputs.task == 'test'
      run: |
        cd foreign/go

        # Create reports directory
        mkdir -p ../../reports

        # Run unit tests with coverage (integration tests run in e2e task)
        go test -v -race -coverprofile=../../reports/go-coverage.out $(go list ./... | grep -v /tests)

        # Generate coverage report
        go tool cover -html=../../reports/go-coverage.out -o ../../reports/go-coverage.html

        # Run tests with JSON output for better reporting
        go test -v -json $(go list ./... | grep -v /tests) > ../../reports/go-tests.json

    - name: Lint
      if: inputs.task == 'lint'
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.3
        working-directory: foreign/go
        args: --timeout=5m
        skip-cache: true

    - name: Lint BDD
      if: inputs.task == 'lint' && hashFiles('bdd/go/go.mod') != ''
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.3
        working-directory: bdd/go
        args: --timeout=5m
        skip-cache: true

    - name: Lint Examples
      if: inputs.task == 'lint' && hashFiles('examples/go/go.mod') != ''
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.3
        working-directory: examples/go
        args: --timeout=5m
        skip-cache: true

    - name: Build
      shell: bash
      if: inputs.task == 'build'
      run: |
        cd foreign/go

        # Build the module
        go build -v ./...

    - name: Setup Rust with cache for e2e
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/setup-rust-with-cache

    # The Go SDK speaks the VSR wire protocol, so every e2e lane runs against
    # a locally built VSR server rather than a container of the legacy one.
    - name: Start Iggy server (plain)
      id: iggy
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        # TODO: change to iggy-server once legacy server is removed (core/server has VSR support)
        cargo-bin: iggy-server-ng
        cargo-features: vsr
        replica-id: "0"
        pid-file: ${{ runner.temp }}/iggy-go-e2e.pid
        log-file: ${{ runner.temp }}/iggy-go-e2e.log
        wait-timeout-seconds: "90"
      env:
        IGGY_SYSTEM_PATH: ${{ runner.temp }}/iggy-go-e2e-data

    - name: Run e2e tests
      shell: bash
      if: inputs.task == 'e2e'
      env:
        IGGY_TCP_ADDRESS: 127.0.0.1:8090
      run: |
        echo "🧪 Running Go e2e tests..."

        # Create reports directory
        mkdir -p reports

        # Run foreign/go e2e tests with coverage
        echo "Running foreign/go e2e tests..."
        cd foreign/go
        go test -v -race \
          -coverprofile=../../reports/go-coverage-e2e-sdk.out \
          ./...

        # Run BDD tests with coverage of foreign/go packages
        # Only tcp_test suite (ginkgo); godog leader_redirection tests
        # require a multi-node cluster not available in CI.
        echo "Running BDD tests..."
        cd ../../bdd/go
        go test -v -race \
          -coverpkg=github.com/apache/iggy/foreign/go/... \
          -coverprofile=../../reports/go-coverage-e2e-bdd.out \
          ./tests/tcp_test/...

        # Merge e2e coverage profiles
        cd ../..
        head -1 reports/go-coverage-e2e-sdk.out > reports/go-coverage-e2e.out
        tail -n +2 reports/go-coverage-e2e-sdk.out >> reports/go-coverage-e2e.out
        tail -n +2 reports/go-coverage-e2e-bdd.out >> reports/go-coverage-e2e.out

    - name: Stop Iggy server (plain)
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy.outputs.pid_file }}
        log-file: ${{ steps.iggy.outputs.log_file }}

    - name: Start Iggy server (TLS)
      id: iggy-tls
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        # TODO: change to iggy-server once legacy server is removed (core/server has VSR support)
        cargo-bin: iggy-server-ng
        cargo-features: vsr
        replica-id: "0"
        pid-file: ${{ runner.temp }}/iggy-go-e2e-tls.pid
        log-file: ${{ runner.temp }}/iggy-go-e2e-tls.log
        wait-timeout-seconds: "90"
      env:
        IGGY_SYSTEM_PATH: ${{ runner.temp }}/iggy-go-e2e-tls-data
        IGGY_TCP_TLS_ENABLED: "true"
        IGGY_TCP_TLS_CERT_FILE: core/certs/iggy_cert.pem
        IGGY_TCP_TLS_KEY_FILE: core/certs/iggy_key.pem

    - name: Run TLS e2e tests
      shell: bash
      if: inputs.task == 'e2e'
      env:
        IGGY_TCP_ADDRESS: 127.0.0.1:8090
        IGGY_TCP_TLS_ENABLED: "true"
      run: |
        echo "🔐 Running Go e2e tests over TLS..."
        cd foreign/go
        go test -v -race ./tests/...

    - name: Stop Iggy server (TLS)
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy-tls.outputs.pid_file }}
        log-file: ${{ steps.iggy-tls.outputs.log_file }}

    # Both replicas of the roster in `core/server-ng/config.toml`, not just this
    # one: a two-replica cluster commits on 2 acks (`quorum_replication`), so a
    # lone node journals every op and commits none, and each client request
    # blocks until it times out.
    - name: Start Iggy VSR cluster node 0
      id: iggy-cluster-0
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        # TODO: change to iggy-server once legacy server is removed (core/server has VSR support)
        cargo-bin: iggy-server-ng
        cargo-features: vsr
        replica-id: "0"
        pid-file: ${{ runner.temp }}/iggy-go-cluster-0.pid
        log-file: ${{ runner.temp }}/iggy-go-cluster-0.log
        wait-timeout-seconds: "90"
      env:
        IGGY_CLUSTER_ENABLED: "true"
        IGGY_SYSTEM_PATH: ${{ runner.temp }}/iggy-go-cluster-0-data

    - name: Start Iggy VSR cluster node 1
      id: iggy-cluster-1
      if: inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-start
      with:
        cargo-bin: iggy-server-ng
        cargo-features: vsr
        replica-id: "1"
        tcp_address: 127.0.0.1:8091
        http_address: 127.0.0.1:3001
        pid-file: ${{ runner.temp }}/iggy-go-cluster-1.pid
        log-file: ${{ runner.temp }}/iggy-go-cluster-1.log
        wait-timeout-seconds: "90"
      env:
        IGGY_CLUSTER_ENABLED: "true"
        IGGY_SYSTEM_PATH: ${{ runner.temp }}/iggy-go-cluster-1-data

    - name: Run cluster e2e tests
      shell: bash
      if: inputs.task == 'e2e'
      env:
        IGGY_TCP_ADDRESS: 127.0.0.1:8090
      run: |
        echo "🗳️ Running Go e2e tests against a two-node cluster..."
        cd foreign/go
        go test -v -race ./tests/...

    - name: Stop Iggy VSR cluster node 1
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy-cluster-1.outputs.pid_file }}
        log-file: ${{ steps.iggy-cluster-1.outputs.log_file }}

    - name: Stop Iggy VSR cluster node 0
      if: always() && inputs.task == 'e2e'
      uses: ./.github/actions/utils/server-stop
      with:
        pid-file: ${{ steps.iggy-cluster-0.outputs.pid_file }}
        log-file: ${{ steps.iggy-cluster-0.outputs.log_file }}

    - name: Upload e2e server logs
      if: always() && inputs.task == 'e2e'
      uses: actions/upload-artifact@v7
      with:
        name: iggy-go-e2e-server-logs
        path: |
          ${{ steps.iggy.outputs.log_file }}
          ${{ steps.iggy-tls.outputs.log_file }}
          ${{ steps.iggy-cluster-0.outputs.log_file }}
          ${{ steps.iggy-cluster-1.outputs.log_file }}
        if-no-files-found: ignore
