name: Simulator geo nightly

# Runs `workload-fuzz --geo --faults swarm` over a range of seeds that moves
# on with every run, so each night tries seeds that no run tried before. The
# logs of failed seeds are kept as an artifact, and a failed run opens an
# issue, or comments on the issue that an earlier failed run opened. A seed
# replays its run with
# `cargo run --profile fuzz -p simulator --bin workload-fuzz -- --geo --faults swarm --seed SEED`.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds to run"
        type: number
        default: 2000

permissions: {}

jobs:
  campaign:
    name: simulator-geo-nightly
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/utils/setup-rust
        with:
          read-cache: "false"
          free-disk-space: "false"

      - name: Build workload-fuzz
        run: cargo build --locked --profile fuzz -p simulator --bin workload-fuzz

      - name: Run the geo campaign
        env:
          SEEDS: ${{ inputs.seeds || '2000' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ ! $SEEDS =~ ^[0-9]+$ ]]; then
            echo "seeds must be a whole number, got $SEEDS" >&2
            exit 1
          fi
          first=$(( (RUN_NUMBER - 1) * SEEDS + 1 ))
          last=$(( first + SEEDS - 1 ))
          scripts/simulator-geo-campaign.sh "$first" "$last" geo-campaign

      - name: Keep the logs of failed seeds
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-geo-campaign
          path: geo-campaign
          retention-days: 30

  # A separate job, so the job that builds and runs code holds no write token.
  report:
    name: Report failure
    needs: campaign
    # A job timeout ends `campaign` as cancelled, which `failure()` does not
    # match.
    if: ${{ !cancelled() && needs.campaign.result != 'success' }}
    # Two reports at once would both find no open issue and open one each.
    concurrency: simulator-geo-nightly-report
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Simulator geo nightly run failed';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 100,
            });
            const existing = openIssues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `The run failed again: ${runUrl}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              labels: ['bug'],
              body: [
                `The simulator geo nightly run failed: ${runUrl}`,
                '',
                'The run summary names each failed seed with its first panic, and the `simulator-geo-campaign` artifact holds their logs.',
              ].join('\n'),
            });
