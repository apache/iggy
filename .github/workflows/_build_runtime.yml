name: _build_runtime
on:
  workflow_call:
    inputs:
      test-scope:
        type: string
        default: affected
      save-cache:
        type: boolean
        default: false
      build-metadata:
        type: boolean
        default: false

permissions:
  contents: read

env:
  IGGY_CI_BUILD: ${{ inputs.build-metadata }}

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build covered runtime binaries
        uses: ./.github/actions/rust/pre-merge
        with:
          task: runtime-build
          test-scope: ${{ inputs.test-scope }}
          save-cache: ${{ inputs.save-cache }}
          free-disk-space-aggressive: ${{ inputs.test-scope == 'workspace' }}

      - name: Upload runtime binaries
        uses: actions/upload-artifact@v7
        with:
          name: rust-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-runtime/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
