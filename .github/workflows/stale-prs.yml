name: Stale PRs

# After labelling, the stale comment gets a hidden marker with the PR's head
# commit. pr-triage-reconcile.yml compares it with the live head to find a
# push that pr-triage-collect.yml never saw, because the PR had a merge
# conflict.

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11.0.0
        id: stale
        with:
          days-before-pr-stale: 7
          days-before-pr-close: 7
          stale-pr-label: "S-stale"
          remove-stale-when-updated: false
          stale-pr-message: >
            This pull request has been automatically marked as stale because
            it has not had recent activity. It will be closed in 7 days if
            no further activity occurs.


            If you need a review, please ensure CI is green and the PR is rebased
            on the latest master. Don't hesitate to ping the maintainers - either
            `@core` on Discord or by mentioning them directly here on the PR.


            Thank you for your contribution!
          close-pr-message: >
            This pull request was automatically closed because it has been
            inactive for 14 days. Feel free to reopen it if you'd like to
            continue working on it.
          # S-waiting-on-review means the next move is ours, not the author's,
          # so the inactivity clock should not run against them.
          exempt-pr-labels: "pinned,S-waiting-on-review"
          exempt-draft-pr: true
          days-before-issue-stale: -1
          days-before-issue-close: -1

      - name: Record the head of each newly stale PR
        if: steps.stale.outputs.staled-issues-prs != '' && steps.stale.outputs.staled-issues-prs != '[]'
        uses: actions/github-script@v9
        env:
          STALED: ${{ steps.stale.outputs.staled-issues-prs }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const MARKER = '<!-- iggy-stale-head:';
            for (const { number } of JSON.parse(process.env.STALED)) {
              try {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: number, per_page: 100,
                });
                const stale = comments
                  .filter(c => c.user && c.user.login === 'github-actions[bot]'
                    && (c.body || '').startsWith('This pull request has been automatically marked as stale'))
                  .pop();
                if (!stale || stale.body.includes(MARKER)) continue;
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: stale.id,
                  body: `${stale.body}\n\n${MARKER}${pr.head.sha} -->`,
                });
                core.info(`#${number}: recorded head ${pr.head.sha}`);
              } catch (e) {
                // Without the marker, pr-triage-reconcile.yml leaves S-stale
                // for the push and comment paths to clear.
                core.warning(`#${number}: could not record the head: ${e.message}`);
              }
            }
