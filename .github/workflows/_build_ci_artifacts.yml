name: _build_ci_artifacts
on:
  workflow_call:
    inputs:
      task:
        description: "Artifact producer: runtime or test-build"
        type: string
        required: true
      test-scope:
        type: string
        default: affected
      save-cache:
        type: boolean
        default: false
      build-metadata:
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 120

permissions:
  contents: read

env:
  IGGY_CI_BUILD: ${{ inputs.build-metadata }}

jobs:
  build:
    name: build
    # Only the test-build producer moves to RunsOn, together with the shards in
    # _rust_tests.yml that consume it. The runtime producer stays on the GitHub-hosted
    # runner. See _rust_tests.yml for the switch and the fork rule.
    # TEMPORARY, remove before merge: the head_ref clause forces RunsOn for the test pull request.
    runs-on: ${{ (vars.USE_RUNS_ON == 'true' || github.head_ref == 'ci/runs-on-rust-tests') && inputs.task == 'test-build' && format('runs-on={0},family=m8a+m7a+c8a,cpu=16,image=ubuntu26-full-x64,disk=large,tag=iggy', github.run_id) || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        if: runner.environment == 'self-hosted'

      - uses: actions/checkout@v7.0.1

      - name: Prepare artifacts
        uses: ./.github/actions/rust/pre-merge
        with:
          task: ${{ inputs.task }}
          test-scope: ${{ inputs.test-scope }}
          save-cache: ${{ inputs.save-cache }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ inputs.task }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-${{ inputs.task }}/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 30
