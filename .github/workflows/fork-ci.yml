# Runs the Pre-merge pipeline for every branch push in a fork, on the fork's
# own runners. fork-ci-status.yml reports the result on the pull request.
#
# This is a separate workflow because a push trigger on pre-merge.yml would
# report its `finalize_pr` check on every commit pushed to apache/iggy.

name: Fork CI
on:
  push:
    # Without a filter a pushed tag starts a run too.
    branches: ["**"]

# pre-merge.yml has its own group, named after this workflow. The two names
# must differ, or the called workflow waits for its caller forever.
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # apache/iggy tests pull requests in pre-merge.yml and master in post-merge.yml.
    if: github.event.repository.fork
    uses: ./.github/workflows/pre-merge.yml
    # A called workflow cannot hold more than its caller grants.
    permissions:
      contents: read
      issues: read
      security-events: write
      pull-requests: write
