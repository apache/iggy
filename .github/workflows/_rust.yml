name: _rust
on:
  workflow_call:
    inputs:
      plan:
        description: "JSON with checks (component/task entries) and tests (boolean)"
        type: string
        required: true
      test-scope:
        description: "Test selection: affected or workspace"
        type: string
        default: affected
      timeout-minutes:
        type: number
        default: 60
      save-cache:
        description: "Save dependencies from the test build for subsequent PRs"
        type: boolean
        default: false
      build-metadata:
        description: "Embed CI build metadata in the server binaries"
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read
  issues: read # live breaking:storage label lookup

env:
  IGGY_CI_BUILD: ${{ inputs.build-metadata }}

jobs:
  checks:
    name: ${{ matrix.component }}/${{ matrix.task }}
    if: ${{ fromJSON(inputs.plan).checks[0] != null }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.plan).checks }}
    runs-on: ${{
      (matrix.task == 'build-aarch64-gnu' || matrix.task == 'build-aarch64-musl') && 'ubuntu-26.04-arm' ||
      (matrix.task == 'build-macos-aarch64' || matrix.task == 'clippy-macos-aarch64') && 'macos-14' ||
      matrix.task == 'build-windows-sdk' && 'windows-latest' ||
      'ubuntu-26.04'
      }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Re-runs replay the original event labels. Read live labels so applying
      # breaking:storage followed by a re-run can skip an intentional format break.
      - name: Resolve breaking:storage escape hatch
        id: storage_hatch
        if: matrix.task == 'test-storage-compat' && github.event.pull_request.number
        uses: actions/github-script@v9
        with:
          script: |
            let skip = false;
            try {
              const labels = await github.paginate(
                github.rest.issues.listLabelsOnIssue,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  per_page: 100,
                },
              );
              skip = labels.some(l => l.name === 'breaking:storage');
            } catch (e) {
              core.warning(`listLabelsOnIssue failed (${e.status ?? e.code ?? 'network'}), running the check`);
            }
            core.info(`breaking:storage escape hatch: skip=${skip}`);
            core.setOutput('skip', String(skip));

      - name: Run Rust check
        if: steps.storage_hatch.outputs.skip != 'true'
        uses: ./.github/actions/rust/pre-merge
        with:
          task: ${{ matrix.task }}
          component: ${{ matrix.component }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.component }}-${{ matrix.task }}-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/**
          if-no-files-found: ignore
          retention-days: 7

  test-build:
    name: Build test artifacts
    if: ${{ fromJSON(inputs.plan).tests }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build coverage test archive
        uses: ./.github/actions/rust/pre-merge
        with:
          task: test-build
          test-scope: ${{ inputs.test-scope }}
          save-cache: ${{ inputs.save-cache }}
          free-disk-space-aggressive: ${{ inputs.test-scope == 'workspace' }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-build-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-test-build/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  tests:
    name: Test shard ${{ matrix.partition }}/${{ strategy.job-total }}
    needs: test-build
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download test artifacts
        uses: actions/download-artifact@v8
        with:
          name: rust-test-build-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-test-build

      - name: Run test shard
        uses: ./.github/actions/rust/pre-merge
        with:
          task: test
          partition: ${{ matrix.partition }}
          partitions: ${{ strategy.job-total }}

      - name: Generate coverage report
        if: always() && !cancelled()
        run: |
          if compgen -G 'target/*.profraw' > /dev/null; then
            cargo llvm-cov report --codecov --output-path codecov.json
          else
            echo "::notice::No coverage profiles found; skipping report"
          fi
        shell: bash

      - name: Upload coverage to Codecov
        if: always() && !cancelled() && hashFiles('codecov.json') != ''
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          disable_search: true
          flags: rust
          fail_ci_if_error: false
          verbose: true
          override_pr: ${{ github.event.pull_request.number }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-${{ matrix.partition }}-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/**
            target/llvm-cov/**
            coverage.lcov
            codecov.json
          if-no-files-found: ignore
          retention-days: 7
