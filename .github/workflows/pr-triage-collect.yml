name: PR Triage Collect

# Trigger relay for pull_request_review. On a cross-fork PR that event
# runs the PR's own copy of this file with a read-only GITHUB_TOKEN, so
# nothing here can label anything, and nothing here can be trusted: a
# fork may rewrite this workflow freely. Its only job is to complete,
# which fires pr-triage-apply.yml via workflow_run on the base ref with
# a write token. Apply reads no artifact, output or file from this run.
# It takes the reviewer and the head commit from the workflow_run
# payload, which GitHub sets, and everything else from the API.
#
# issue_comment is not routed through here: it runs the default-branch
# workflow with the declared permissions and is handled directly in
# pr-triage-apply.yml.

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  collect:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 1
    steps:
      - name: Relay
        run: 'true'
