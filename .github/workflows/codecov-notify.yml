name: Codecov notify

# Sends the single Codecov notification (PR comment and commit statuses)
# for a finished coverage run. codecov.yml sets notify.manual_trigger, so
# the uploads of the test legs never notify on their own.
#
# Why workflow_run: the Codecov endpoint behind send-notifications rejects
# tokenless calls, and a fork pull request gets no secrets in Pre-merge.
# This workflow runs from the default branch with the secrets. It takes only
# head_sha from the event and runs no pull request code, so a fork that
# names its own workflow "Pre-merge" can only notify for its own commit.

on:
  workflow_run:
    workflows: ["Pre-merge", "Coverage baseline"]
    types: [completed]

permissions: {}

jobs:
  notify:
    # Concurrency cancels a run when a newer one starts for the same pull
    # request or branch, and the newer run sends its own trigger.
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Send Codecov notifications
        uses: codecov/codecov-action@v7.1.1
        with:
          run_command: send-notifications
          token: ${{ secrets.CODECOV_TOKEN }}
          # Under workflow_run GITHUB_SHA is the default branch tip, not the
          # commit the finished run uploaded coverage for.
          override_commit: ${{ github.event.workflow_run.head_sha }}
          fail_ci_if_error: false
          verbose: true
