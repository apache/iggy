# PR gate: detects changed components, builds test matrices, and runs
# lint/test/build/BDD/examples jobs only for affected languages.
# All jobs must pass before merge.

name: Pre-merge
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  # listLabelsOnIssue in _rust.yml, for the breaking:storage escape hatch
  issues: read
  security-events: write
  pull-requests: write

jobs:
  # Common checks - always run
  common:
    name: Common checks
    needs: detect
    uses: ./.github/workflows/_common.yml
    with:
      validate-third-party-licenses: ${{ needs.detect.outputs.third_party_licenses == 'true' }}
    permissions:
      contents: read
      pull-requests: read

  # Detect changes and build matrices
  detect:
    name: Detect changes
    uses: ./.github/workflows/_detect.yml

  runtime:
    name: Runtime binaries
    needs: detect
    if: needs.detect.outputs.runtime == 'true'
    uses: ./.github/workflows/_build_ci_artifacts.yml
    with:
      task: runtime
      timeout-minutes: 60

  rust-test-build:
    name: Rust test artifacts
    needs: detect
    if: needs.detect.outputs.rust_runtime_plan != '' && fromJSON(needs.detect.outputs.rust_runtime_plan).tests
    uses: ./.github/workflows/_build_ci_artifacts.yml
    with:
      task: test-build
      timeout-minutes: 60

  # Rust components
  test-rust:
    name: Rust
    needs: detect
    if: needs.detect.outputs.rust_plan != ''
    uses: ./.github/workflows/_rust.yml
    with:
      plan: ${{ needs.detect.outputs.rust_plan }}

  test-rust-runtime:
    name: Rust tests
    needs: [detect, runtime, rust-test-build]
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.rust_runtime_plan != '' }}
    uses: ./.github/workflows/_rust.yml
    with:
      plan: ${{ needs.detect.outputs.rust_runtime_plan }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Python SDK
  test-python:
    name: Python
    needs: [detect, runtime]
    if: ${{ !cancelled() && !failure() && fromJson(needs.detect.outputs.python_matrix).include[0].component != 'noop' }}
    uses: ./.github/workflows/_test.yml
    with:
      matrix: ${{ needs.detect.outputs.python_matrix }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # PHP SDK
  test-php:
    name: PHP
    needs: [detect, runtime]
    if: ${{ !cancelled() && !failure() && fromJson(needs.detect.outputs.php_matrix).include[0].component != 'noop' }}
    uses: ./.github/workflows/_test.yml
    with:
      matrix: ${{ needs.detect.outputs.php_matrix }}
      fail-fast: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Node SDK
  test-node:
    name: Node
    needs: [detect, runtime]
    if: ${{ !cancelled() && !failure() && fromJson(needs.detect.outputs.node_matrix).include[0].component != 'noop' }}
    uses: ./.github/workflows/_test.yml
    with:
      matrix: ${{ needs.detect.outputs.node_matrix }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Go SDK
  test-go:
    name: Go
    needs: [detect, runtime]
    if: ${{ !cancelled() && !failure() && fromJson(needs.detect.outputs.go_matrix).include[0].component != 'noop' }}
    uses: ./.github/workflows/_test.yml
    with:
      matrix: ${{ needs.detect.outputs.go_matrix }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Java SDK
  test-java:
    name: Java
    needs: [detect, runtime]
    if: ${{ !cancelled() && !failure() && fromJson(needs.detect.outputs.java_matrix).include[0].component != 'noop' }}
    uses: ./.github/workflows/_test.yml
    with:
      matrix: ${{ needs.detect.outputs.java_matrix }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # C# SDK
  test-csharp:
    name: C#
    needs: [detect, runtime]
    if: ${{ !cancelled() && !failure() && fromJson(needs.detect.outputs.csharp_matrix).include[0].component != 'noop' }}
    uses: ./.github/workflows/_test.yml
    with:
      matrix: ${{ needs.detect.outputs.csharp_matrix }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # C++ SDK
  test-cpp:
    name: C++
    needs: [detect, runtime]
    if: ${{ !cancelled() && !failure() && fromJson(needs.detect.outputs.cpp_matrix).include[0].component != 'noop' }}
    uses: ./.github/workflows/_test.yml
    with:
      matrix: ${{ needs.detect.outputs.cpp_matrix }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Swift SDK
  test-swift:
    name: Swift
    needs: [detect, runtime]
    if: ${{ !cancelled() && !failure() && fromJson(needs.detect.outputs.swift_matrix).include[0].component != 'noop' }}
    uses: ./.github/workflows/_test.yml
    with:
      matrix: ${{ needs.detect.outputs.swift_matrix }}

  # Other components
  test-other:
    name: Other
    needs: detect
    if: ${{ fromJson(needs.detect.outputs.other_matrix).include[0].component != 'noop' }}
    uses: ./.github/workflows/_test.yml
    with:
      matrix: ${{ needs.detect.outputs.other_matrix }}

  # BDD Tests
  test-bdd:
    name: BDD
    needs: [detect, runtime]
    if: ${{ !cancelled() && !failure() && fromJson(needs.detect.outputs.bdd_matrix).include[0].component != 'noop' }}
    uses: ./.github/workflows/_test_bdd.yml
    with:
      matrix: ${{ needs.detect.outputs.bdd_matrix }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Examples Tests
  test-examples:
    name: Examples
    needs: [detect, runtime]
    if: ${{ !cancelled() && !failure() && fromJson(needs.detect.outputs.examples_matrix).include[0].component != 'noop' }}
    uses: ./.github/workflows/_test_examples.yml
    with:
      matrix: ${{ needs.detect.outputs.examples_matrix }}

  # Final status check
  finalize_pr:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    needs: [common, detect, runtime, rust-test-build, test-rust, test-rust-runtime, test-python, test-php, test-node, test-go, test-java, test-csharp, test-cpp, test-swift, test-bdd, test-examples, test-other]
    if: ${{ !cancelled() }}
    steps:
      - name: Get job execution times
        id: times
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });

            const formatDuration = ms => {
              const seconds = Math.floor(ms / 1000);
              return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
            };
            const groups = {
              rust: 'Rust', rust_tests: 'Rust tests', python: 'Python', php: 'PHP', node: 'Node',
              go: 'Go', java: 'Java', csharp: 'C#', cpp: 'C++', swift: 'Swift',
              bdd: 'BDD', examples: 'Examples', other: 'Other',
              common: 'Common checks', detect: 'Detect changes', runtime: 'Runtime binaries',
              rust_test_build: 'Rust test artifacts',
            };
            for (const [key, group] of Object.entries(groups)) {
              const completed = jobs.filter(job =>
                (job.name === group || job.name.startsWith(`${group} /`)) &&
                job.conclusion !== 'skipped' && job.started_at && job.completed_at);
              const duration = completed.length ? formatDuration(
                Math.max(...completed.map(job => new Date(job.completed_at).getTime())) -
                Math.min(...completed.map(job => new Date(job.started_at).getTime()))
              ) : '-';
              core.setOutput(`${key}_time`, duration);
            }

            // Calculate total time - find the earliest job start time
            let earliestStart = null;
            let latestEnd = null;
            for (const job of jobs) {
              if (job.started_at) {
                const start = new Date(job.started_at);
                if (!earliestStart || start < earliestStart) {
                  earliestStart = start;
                }
              }
              if (job.completed_at) {
                const end = new Date(job.completed_at);
                if (!latestEnd || end > latestEnd) {
                  latestEnd = end;
                }
              }
            }

            if (earliestStart && latestEnd) {
              const totalDuration = latestEnd - earliestStart;
              core.setOutput('total_time', formatDuration(totalDuration));
            } else if (earliestStart) {
              const totalDuration = Date.now() - earliestStart;
              core.setOutput('total_time', formatDuration(totalDuration) + ' (running)');
            } else {
              core.setOutput('total_time', '-');
            }


      - name: Check status
        run: |
          set -euxo pipefail
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Helper function to format status with appropriate emoji
          format_status() {
            local status="$1"
            local duration="$2"

            case "$status" in
              "success")
                if [[ "$duration" == "-" ]]; then
                  echo "✅ success"
                else
                  echo "✅ success"
                fi
                ;;
              "failure")
                echo "❌ failure"
                ;;
              "cancelled")
                echo "🚫 cancelled"
                ;;
              "skipped")
                echo "⏭️ skipped"
                ;;
              *)
                echo "⏸️ $status"
                ;;
            esac
          }

          # Language test results with timing
          echo "### Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Status | Duration |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|----------|" >> "$GITHUB_STEP_SUMMARY"

          # Detection and Common checks always run
          detect_status=$(format_status "${{ needs.detect.result }}" "${{ steps.times.outputs.detect_time }}")
          common_status=$(format_status "${{ needs.common.result }}" "${{ steps.times.outputs.common_time }}")
          echo "| 🔍 Detection | $detect_status | ${{ steps.times.outputs.detect_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📋 Common Checks | $common_status | ${{ steps.times.outputs.common_time }} |" >> "$GITHUB_STEP_SUMMARY"

          runtime_status=$(format_status "${{ needs.runtime.result }}" "${{ steps.times.outputs.runtime_time }}")
          echo "| Runtime binaries | $runtime_status | ${{ steps.times.outputs.runtime_time }} |" >> "$GITHUB_STEP_SUMMARY"
          rust_test_build_status=$(format_status "${{ needs.rust-test-build.result }}" "${{ steps.times.outputs.rust_test_build_time }}")
          echo "| Rust test artifacts | $rust_test_build_status | ${{ steps.times.outputs.rust_test_build_time }} |" >> "$GITHUB_STEP_SUMMARY"

          # Language/component tests
          rust_status=$(format_status "${{ needs.test-rust.result }}" "${{ steps.times.outputs.rust_time }}")
          rust_tests_status=$(format_status "${{ needs.test-rust-runtime.result }}" "${{ steps.times.outputs.rust_tests_time }}")
          python_status=$(format_status "${{ needs.test-python.result }}" "${{ steps.times.outputs.python_time }}")
          php_status=$(format_status "${{ needs.test-php.result }}" "${{ steps.times.outputs.php_time }}")
          node_status=$(format_status "${{ needs.test-node.result }}" "${{ steps.times.outputs.node_time }}")
          go_status=$(format_status "${{ needs.test-go.result }}" "${{ steps.times.outputs.go_time }}")
          java_status=$(format_status "${{ needs.test-java.result }}" "${{ steps.times.outputs.java_time }}")
          csharp_status=$(format_status "${{ needs.test-csharp.result }}" "${{ steps.times.outputs.csharp_time }}")
          cpp_status=$(format_status "${{ needs.test-cpp.result }}" "${{ steps.times.outputs.cpp_time }}")
          swift_status=$(format_status "${{ needs.test-swift.result }}" "${{ steps.times.outputs.swift_time }}")
          bdd_status=$(format_status "${{ needs.test-bdd.result }}" "${{ steps.times.outputs.bdd_time }}")
          examples_status=$(format_status "${{ needs.test-examples.result }}" "${{ steps.times.outputs.examples_time }}")
          other_status=$(format_status "${{ needs.test-other.result }}" "${{ steps.times.outputs.other_time }}")

          echo "| 🦀 Rust | $rust_status | ${{ steps.times.outputs.rust_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🦀 Rust tests | $rust_tests_status | ${{ steps.times.outputs.rust_tests_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🐍 Python | $python_status | ${{ steps.times.outputs.python_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🐘 PHP | $php_status | ${{ steps.times.outputs.php_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟢 Node | $node_status | ${{ steps.times.outputs.node_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🐹 Go | $go_status | ${{ steps.times.outputs.go_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ☕ Java | $java_status | ${{ steps.times.outputs.java_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔷 C# | $csharp_status | ${{ steps.times.outputs.csharp_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔶 C++ | $cpp_status | ${{ steps.times.outputs.cpp_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🐦 Swift | $swift_status | ${{ steps.times.outputs.swift_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🧪 BDD | $bdd_status | ${{ steps.times.outputs.bdd_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📚 Examples | $examples_status | ${{ steps.times.outputs.examples_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📦 Other | $other_status | ${{ steps.times.outputs.other_time }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total workflow time:** ${{ steps.times.outputs.total_time }}" >> "$GITHUB_STEP_SUMMARY"

          # Check for failures
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **CI Failed** - Please check the logs for details." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **CI Cancelled** - The workflow was cancelled." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **CI Passed** - All checks completed successfully!" >> "$GITHUB_STEP_SUMMARY"
          fi
