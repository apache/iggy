name: Benchmark Rust setup

on:
  pull_request:
    paths:
      - ".github/actions/utils/setup-rust-with-cache/action.yml"
      - ".github/workflows/benchmark-rust-setup.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.profile }} / run-${{ matrix.repetition }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile:
          - baseline
          - optimized
        repetition:
          - 1
          - 2
          - 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Record start time
        id: clock
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: ./.github/actions/utils/setup-rust-with-cache
        with:
          install-nextest: ${{ matrix.profile == 'baseline' }}
          install-system-dependencies: ${{ matrix.profile == 'baseline' }}

          read-cache: "false"
          free-disk-space: "false"

      - name: Verify setup
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          cargo --version

          if [[ "$PROFILE" == "baseline" ]]; then
            command -v cargo-nextest
            cargo nextest --version
          fi

          cargo fmt --all -- --check

      - name: Report duration
        env:
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          PROFILE: ${{ matrix.profile }}
          REPETITION: ${{ matrix.repetition }}
        run: |
          finished_at=$(date +%s)
          elapsed=$((finished_at - STARTED_AT))

          echo "::notice title=Rust setup benchmark::${PROFILE} run ${REPETITION}: ${elapsed}s"

          {
            echo "## Rust setup benchmark"
            echo ""
            echo "| Profile | Repetition | Duration |"
            echo "| --- | ---: | ---: |"
            echo "| ${PROFILE} | ${REPETITION} | ${elapsed}s |"
          } >> "$GITHUB_STEP_SUMMARY"
